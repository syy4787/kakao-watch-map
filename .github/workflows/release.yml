# Claude 가 코드를 고쳐 main 에 올리면 → 서명된 APK 를 만들어 GitHub Release 로 게시
# → 워치 앱이 새 버전을 알아서 받아 설치한다.
name: Build & release (watch auto-update)

on:
  push:
    branches: [ main ]
    # 문서·워치 재생 화면(web/, 따로 GitHub Pages 로 올림)만 바뀌면 앱을 새로 배포하지 않는다
    paths-ignore: [ '**.md', 'web/**', 'tools/**', '.github/workflows/pages.yml' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # 서명 비밀번호(Secret)가 아직 없으면 실패 대신 건너뛴다 (등록 후 다음 커밋부터 자동 배포).
      # main 의 최신 커밋만 배포한다 — 예전 실행을 다시 돌리거나 다른 가지에서 돌리면 그 옛 코드가 '최신'으로 올라가
      # 워치가 옛 버전으로 '업데이트'된다
      - name: Check signing secret and that this is the newest main
        id: check
        env:
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(printf '%s' "$RELEASE_KEY_PASSWORD" | tr -d '[:space:]')" ]; then
            echo "::warning::저장소 Settings > Secrets and variables > Actions 에 RELEASE_KEY_PASSWORD 를 추가하면 다음 커밋부터 배포돼요"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::notice::main 이 아닌 곳($GITHUB_REF)에서는 배포하지 않아요"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          NEWEST=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha || true)
          if [ -z "$NEWEST" ]; then
            echo "::error::main 의 최신 커밋을 알 수 없어 배포하지 않아요"
            exit 1
          fi
          if [ "$NEWEST" != "$GITHUB_SHA" ]; then
            echo "::notice::이 커밋(${GITHUB_SHA::7})은 main 의 최신(${NEWEST::7})이 아니라 배포하지 않아요 — 최신 커밋의 실행이 배포해요"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        if: steps.check.outputs.ready == 'true'

      - uses: actions/setup-java@v6
        if: steps.check.outputs.ready == 'true'
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6
        if: steps.check.outputs.ready == 'true'

      # 버전 번호는 항상 커져야 워치가 업데이트를 받는다:
      # 이미 올라간 릴리스(v숫자) 중 가장 큰 번호 + 1 과 (100 + 실행 번호) 중 큰 값
      - name: Version
        if: steps.check.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # 목록을 못 받으면 여기서 멈춘다 (번호가 거꾸로 가면 워치가 업데이트를 못 받음)
          TAGS=$(gh release list --limit 200 --json tagName -q '.[].tagName')
          LAST=$(printf '%s\n' "$TAGS" | sed -n 's/^v\([0-9][0-9]*\)$/\1/p' | sort -n | tail -1 || true)
          LAST=${LAST:-100}
          RUN_BASED=$((100 + GITHUB_RUN_NUMBER))
          CODE=$(( LAST + 1 > RUN_BASED ? LAST + 1 : RUN_BASED ))
          echo "VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=2.$((CODE - 100))" >> "$GITHUB_ENV"
          echo "versionCode=$CODE"

      - name: Decrypt signing key and API keys
        if: steps.check.outputs.ready == 'true'
        env:
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          # 붙여넣다 섞인 공백·줄바꿈·'비밀번호:' 글자는 떼고 쓴다
          PW=$(bash .github/scripts/signing-password.sh)
          echo "::add-mask::$PW"
          export PW
          for f in release.jks secrets.properties; do
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in "signing/$f.enc" \
              -out "$RUNNER_TEMP/$f" -pass env:PW || {
                echo "::error::서명 비밀번호가 맞지 않아요. Settings > Secrets and variables > Actions 에서 RELEASE_KEY_PASSWORD 를 서명키_비밀번호.txt 의 값으로 다시 넣어 주세요"
                exit 1
              }
          done
          # 암호화 파일에서 꺼낸 키들은 GitHub 가 모르는 값이라 직접 가린다 (어떤 단계의 로그에도 나오지 않게)
          sed -n 's/^[[:space:]]*[^#![:space:]][^=:]*[=:][[:space:]]*//p' "$RUNNER_TEMP/secrets.properties" | tr -d ' \t\r' |
            while IFS= read -r v; do
              if [ -n "$v" ]; then echo "::add-mask::$v"; fi
            done

      # 유튜브 키가 실제로 되는지 한 번 물어 실행 요약에 남긴다 (영상 정보 1건 — 하루 한도 1만 중 1).
      # 안 돼도 배포는 그대로 한다 — 앱은 그때 카카오 동영상 검색으로 찾는다
      - name: Check YouTube key
        if: steps.check.outputs.ready == 'true'
        continue-on-error: true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SECRETS_FILE: ${{ runner.temp }}/secrets.properties
        run: bash .github/scripts/check-youtube-key.sh

      # 유튜브 로그인 클라이언트(구글 OAuth 'TV 및 입력 제한 기기')가 되는지 — 코드를 받아 토큰을 한 번 물어본다
      # ('아직 허용 안 함'이 오면 ID·비밀이 맞음). 안 돼도 배포는 그대로 (앱은 '로그인 준비 중'으로)
      - name: Check YouTube login
        if: steps.check.outputs.ready == 'true'
        continue-on-error: true
        env:
          YOUTUBE_OAUTH_CLIENT_ID: ${{ secrets.YOUTUBE_OAUTH_CLIENT_ID }}
          YOUTUBE_OAUTH_CLIENT_SECRET: ${{ secrets.YOUTUBE_OAUTH_CLIENT_SECRET }}
          SECRETS_FILE: ${{ runner.temp }}/secrets.properties
        run: bash .github/scripts/check-youtube-login.sh

      # 키를 바꾸거나(TAGO 실시간 버스 키 추가 등) 할 때는 저장소 Secrets 에 같은 이름으로 넣으면
      # 암호화 파일보다 우선한다 (비어 있으면 무시)
      - name: Test and build signed APK
        if: steps.check.outputs.ready == 'true'
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/release.jks
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          SECRETS_FILE: ${{ runner.temp }}/secrets.properties
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          TAGO_SERVICE_KEY: ${{ secrets.TAGO_SERVICE_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_OAUTH_CLIENT_ID: ${{ secrets.YOUTUBE_OAUTH_CLIENT_ID }}
          YOUTUBE_OAUTH_CLIENT_SECRET: ${{ secrets.YOUTUBE_OAUTH_CLIENT_SECRET }}
        run: |
          RELEASE_KEY_PASSWORD=$(bash .github/scripts/signing-password.sh)
          export RELEASE_KEY_PASSWORD
          ./gradlew --no-daemon testDebugUnitTest assembleRelease

      # kakao-watch-map.apk = 모든 CPU 용 (처음 설치·예전 버전 앱의 업데이트용)
      # kakao-watch-map-<CPU>.apk = CPU 별 (새 버전 앱은 update.json 의 apks 에서 자기 것만 받는다 — 워치는 armeabi-v7a)
      - name: Prepare release files
        if: steps.check.outputs.ready == 'true'
        run: |
          set -euo pipefail
          OUT=app/build/outputs/apk/release
          BASE="https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION_CODE"
          cp "$OUT/app-universal-release.apk" kakao-watch-map.apk
          APKS='{}'
          for ABI in armeabi-v7a arm64-v8a; do
            cp "$OUT/app-$ABI-release.apk" "kakao-watch-map-$ABI.apk"
            ABI_SHA=$(sha256sum "kakao-watch-map-$ABI.apk" | cut -d' ' -f1)
            ABI_SIZE=$(stat -c %s "kakao-watch-map-$ABI.apk")
            APKS=$(jq -c --arg abi "$ABI" --arg url "$BASE/kakao-watch-map-$ABI.apk" --arg sha "$ABI_SHA" --argjson size "$ABI_SIZE" \
              '. + {($abi): {url: $url, sha256: $sha, size: $size}}' <<< "$APKS")
          done
          # 워치에 설치된 앱과 같은 키로 서명됐는지 (다르면 워치가 거부하므로 올리지 않는다)
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          for f in kakao-watch-map*.apk; do
            "$APKSIGNER" verify --print-certs "$f" \
              | grep -q "SHA-256 digest: 926c87e6d4541f89907fa59de7d6608b60ec30e7451daf3ee74ae03ce841272f" \
              || { echo "::error::$f 의 서명 키가 워치 앱과 달라요"; exit 1; }
          done
          SHA=$(sha256sum kakao-watch-map.apk | cut -d' ' -f1)
          # 크기 — 큰 업데이트(재생 엔진 포함)는 워치가 자동으로는 Wi-Fi 에서만 받는다
          SIZE=$(stat -c %s kakao-watch-map.apk)
          NOTES=$(git log -1 --pretty=%s)
          echo "NOTES=$NOTES" >> "$GITHUB_ENV"
          jq -n \
            --argjson code "$VERSION_CODE" \
            --arg name "$VERSION_NAME" \
            --arg url "$BASE/kakao-watch-map.apk" \
            --arg sha "$SHA" \
            --arg notes "$NOTES" \
            --argjson apks "$APKS" \
            --argjson size "$SIZE" \
            '{versionCode: $code, versionName: $name, apkUrl: $url, sha256: $sha, size: $size, notes: $notes, apks: $apks}' > update.json
          cat update.json
          ls -l kakao-watch-map*.apk

      # 작은 업데이트: 최근 릴리스 3개의 CPU 별 APK 에서 새 APK 를 만드는 패치(.kwdelta)를 만들어 update.json 에 적는다.
      # 재생 엔진(약 100MB)은 그대로라 패치는 몇 MB — 워치가 깔린 APK 와 맞는 패치만 받아 새 APK 를 똑같이 다시 만든다.
      # 스크립트가 만든 패치를 직접 적용해 새 APK 와 같은지 확인하고, 이 단계가 실패해도 배포는 전체 APK 로 그대로 한다
      - name: Small updates (deltas)
        if: steps.check.outputs.ready == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 .github/scripts/test_make_deltas.py
          BASE="https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION_CODE"
          PREV=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=20" --jq '.[].tag_name' \
            | sed -n 's/^v\([0-9][0-9]*\)$/\1/p' | sort -rn | awk -v cur="$VERSION_CODE" '$1 < cur' | head -3)
          mkdir -p deltas prev
          for ABI in armeabi-v7a arm64-v8a; do
            OLDS=()
            for V in $PREV; do
              F="prev/v$V-$ABI.apk"
              if gh release download "v$V" -p "kakao-watch-map-$ABI.apk" -O "$F" --clobber; then
                OLDS+=(--old "$V=$F")
              fi
            done
            if [ ${#OLDS[@]} -eq 0 ]; then continue; fi
            python3 .github/scripts/make-deltas.py --new "kakao-watch-map-$ABI.apk" "${OLDS[@]}" \
              --out-dir deltas --prefix "kakao-watch-map-$ABI" --url-base "$BASE" > "deltas/$ABI.json"
            jq --arg abi "$ABI" --slurpfile p "deltas/$ABI.json" '.apks[$abi].patches = $p[0]' update.json > update.tmp
            mv update.tmp update.json
          done
          ls -l deltas
          cat update.json
          N=$(ls deltas/*.kwdelta 2>/dev/null | wc -l)
          echo "::notice title=작은 업데이트::패치 ${N}개 — $(ls -l deltas/*armeabi-v7a*.kwdelta 2>/dev/null | awk '{printf "%s %.1fMB  ", $9, $5/1048576}')"

      - name: Publish GitHub release
        if: steps.check.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          FILES=(kakao-watch-map.apk kakao-watch-map-armeabi-v7a.apk kakao-watch-map-arm64-v8a.apk update.json deltas/*.kwdelta)
          gh release create "v$VERSION_CODE" "${FILES[@]}" \
            --target "$GITHUB_SHA" --title "v$VERSION_NAME" --notes "$NOTES" --latest

      - name: Clean up secrets
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" "$RUNNER_TEMP/secrets.properties"
