# Claude 가 코드를 고쳐 main 에 올리면 → 서명된 APK 를 만들어 GitHub Release 로 게시
# → 워치 앱이 새 버전을 알아서 받아 설치한다.
name: Build & release (watch auto-update)

on:
  push:
    branches: [ main ]
    # 문서·워치 재생 화면(web/, 따로 GitHub Pages 로 올림)만 바뀌면 앱을 새로 배포하지 않는다
    paths-ignore: [ '**.md', 'web/**', 'tools/**', '.github/workflows/pages.yml' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # 서명 비밀번호(Secret)가 아직 없으면 실패 대신 건너뛴다 (등록 후 다음 커밋부터 자동 배포)
      - name: Check signing secret
        id: check
        env:
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$(printf '%s' "$RELEASE_KEY_PASSWORD" | tr -d '[:space:]')" ]; then
            echo "::warning::저장소 Settings > Secrets and variables > Actions 에 RELEASE_KEY_PASSWORD 를 추가하면 다음 커밋부터 배포돼요"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.check.outputs.ready == 'true'

      - uses: actions/setup-java@v6
        if: steps.check.outputs.ready == 'true'
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6
        if: steps.check.outputs.ready == 'true'

      # 버전 번호는 항상 커져야 워치가 업데이트를 받는다:
      # 이미 올라간 릴리스(v숫자) 중 가장 큰 번호 + 1 과 (100 + 실행 번호) 중 큰 값
      - name: Version
        if: steps.check.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # 목록을 못 받으면 여기서 멈춘다 (번호가 거꾸로 가면 워치가 업데이트를 못 받음)
          TAGS=$(gh release list --limit 200 --json tagName -q '.[].tagName')
          LAST=$(printf '%s\n' "$TAGS" | sed -n 's/^v\([0-9][0-9]*\)$/\1/p' | sort -n | tail -1 || true)
          LAST=${LAST:-100}
          RUN_BASED=$((100 + GITHUB_RUN_NUMBER))
          CODE=$(( LAST + 1 > RUN_BASED ? LAST + 1 : RUN_BASED ))
          echo "VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=2.$((CODE - 100))" >> "$GITHUB_ENV"
          echo "versionCode=$CODE"

      - name: Decrypt signing key and API keys
        if: steps.check.outputs.ready == 'true'
        env:
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          # 붙여넣다 섞인 공백·줄바꿈·'비밀번호:' 글자는 떼고 쓴다
          PW=$(bash .github/scripts/signing-password.sh)
          echo "::add-mask::$PW"
          export PW
          for f in release.jks secrets.properties; do
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in "signing/$f.enc" \
              -out "$RUNNER_TEMP/$f" -pass env:PW || {
                echo "::error::서명 비밀번호가 맞지 않아요. Settings > Secrets and variables > Actions 에서 RELEASE_KEY_PASSWORD 를 서명키_비밀번호.txt 의 값으로 다시 넣어 주세요"
                exit 1
              }
          done

      # 유튜브 키가 실제로 되는지 한 번 물어 실행 요약에 남긴다 (영상 정보 1건 — 하루 한도 1만 중 1).
      # 안 돼도 배포는 그대로 한다 — 앱은 그때 카카오 동영상 검색으로 찾는다
      - name: Check YouTube key
        if: steps.check.outputs.ready == 'true'
        continue-on-error: true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SECRETS_FILE: ${{ runner.temp }}/secrets.properties
        run: bash .github/scripts/check-youtube-key.sh

      # 키를 바꾸거나(TAGO 실시간 버스 키 추가 등) 할 때는 저장소 Secrets 에 같은 이름으로 넣으면
      # 암호화 파일보다 우선한다 (비어 있으면 무시)
      - name: Test and build signed APK
        if: steps.check.outputs.ready == 'true'
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/release.jks
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          SECRETS_FILE: ${{ runner.temp }}/secrets.properties
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          TAGO_SERVICE_KEY: ${{ secrets.TAGO_SERVICE_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          RELEASE_KEY_PASSWORD=$(bash .github/scripts/signing-password.sh)
          export RELEASE_KEY_PASSWORD
          ./gradlew --no-daemon testDebugUnitTest assembleRelease

      # kakao-watch-map.apk = 모든 CPU 용 (처음 설치·예전 버전 앱의 업데이트용)
      # kakao-watch-map-<CPU>.apk = CPU 별 (새 버전 앱은 update.json 의 apks 에서 자기 것만 받는다 — 워치는 armeabi-v7a)
      - name: Prepare release files
        if: steps.check.outputs.ready == 'true'
        run: |
          set -euo pipefail
          OUT=app/build/outputs/apk/release
          BASE="https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION_CODE"
          cp "$OUT/app-universal-release.apk" kakao-watch-map.apk
          APKS='{}'
          for ABI in armeabi-v7a arm64-v8a; do
            cp "$OUT/app-$ABI-release.apk" "kakao-watch-map-$ABI.apk"
            ABI_SHA=$(sha256sum "kakao-watch-map-$ABI.apk" | cut -d' ' -f1)
            APKS=$(jq -c --arg abi "$ABI" --arg url "$BASE/kakao-watch-map-$ABI.apk" --arg sha "$ABI_SHA" \
              '. + {($abi): {url: $url, sha256: $sha}}' <<< "$APKS")
          done
          # 워치에 설치된 앱과 같은 키로 서명됐는지 (다르면 워치가 거부하므로 올리지 않는다)
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          for f in kakao-watch-map*.apk; do
            "$APKSIGNER" verify --print-certs "$f" \
              | grep -q "SHA-256 digest: 926c87e6d4541f89907fa59de7d6608b60ec30e7451daf3ee74ae03ce841272f" \
              || { echo "::error::$f 의 서명 키가 워치 앱과 달라요"; exit 1; }
          done
          SHA=$(sha256sum kakao-watch-map.apk | cut -d' ' -f1)
          NOTES=$(git log -1 --pretty=%s)
          echo "NOTES=$NOTES" >> "$GITHUB_ENV"
          jq -n \
            --argjson code "$VERSION_CODE" \
            --arg name "$VERSION_NAME" \
            --arg url "$BASE/kakao-watch-map.apk" \
            --arg sha "$SHA" \
            --arg notes "$NOTES" \
            --argjson apks "$APKS" \
            '{versionCode: $code, versionName: $name, apkUrl: $url, sha256: $sha, notes: $notes, apks: $apks}' > update.json
          cat update.json
          ls -l kakao-watch-map*.apk

      - name: Publish GitHub release
        if: steps.check.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION_CODE" \
            kakao-watch-map.apk kakao-watch-map-armeabi-v7a.apk kakao-watch-map-arm64-v8a.apk update.json \
            --target "$GITHUB_SHA" --title "v$VERSION_NAME" --notes "$NOTES" --latest

      - name: Clean up secrets
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" "$RUNNER_TEMP/secrets.properties"
