<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- 화면 폭을 240 으로 고정: 워치 크기·확대 설정이 달라도 같은 배치, 200×200 플레이어가 늘 들어간다 -->
<meta name="viewport" content="width=240, viewport-fit=cover">
<!-- 유튜브 임베드는 Referer 로 어디서 트는지 확인한다(없으면 153 오류) — 기본값을 그대로 쓴다고 못 박아 둔다 -->
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<!-- 워치 앱이 이 화면에 닿는지 확인할 때 찾는 표시 -->
<meta name="kakaowatch-player" content="1">
<title>워치 유튜브</title>
<style>
  /*
   * 갤럭시워치(둥근 화면)용 유튜브 재생 화면: 검은 바탕, 굵은 흰 제목·회색 채널, 큰 흰 재생 버튼.
   * 첫 화면 = 유튜브 공식 플레이어(최소 200×200)만 가운데. 베젤을 돌리면 제목·진행·큰 조작 버튼 → 소리·반복 → 다음 동영상 → 폰으로.
   * 우리 것은 플레이어 위에 절대 겹치지 않는다 (유튜브 임베드 규칙).
   * 워치 앱 안(GeckoView, app=1)에서도, 워치 인터넷 앱에서도 연다. 로그인 없는 플레이어라 프리미엄은 폰에서.
   * 무엇을 틀지 (# 뒤): v=처음 동영상 · mix=1 (유튜브 믹스) · ids=다음 동영상들 (앱의 목록 그대로) · list=재생목록 번호
   */
  :root {
    --bg: #000;
    --fg: #fff;
    --dim: #aaa;
    --card: #1f1f1f;
    --chip: #2a2a2a;
    --primary: #fff;
    --on-primary: #0f0f0f;
    --track: #3d3d3d;
    --fill: #ff4e45;
    --focus: #8ab4f8;
    --warn: #ff9e80;
    --player: 200px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: var(--bg); scroll-snap-type: y proximity; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font-family: system-ui, -apple-system, "SamsungOne", "Noto Sans KR", sans-serif;
    overflow-x: hidden; word-break: keep-all; overflow-wrap: anywhere;
    -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
    -webkit-user-select: none; user-select: none;
  }
  button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; touch-action: manipulation; }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  button:disabled { opacity: .35; cursor: default; }
  svg { display: block; }

  /* 첫 화면: 플레이어만 둥근 화면 한가운데 */
  .stage {
    position: relative; height: 100vh; height: 100dvh; min-height: calc(var(--player) + 24px);
    display: flex; align-items: center; justify-content: center; scroll-snap-align: center;
  }
  #player, .stage iframe { width: var(--player); height: var(--player); display: block; border: 0; flex: none; background: #000; }
  /* 플레이어가 없을 때(곡 없음·연결 안 됨)만 첫 화면 가운데에 보이는 안내 */
  #stageMsg {
    position: absolute; left: 12%; right: 12%; top: 50%; transform: translateY(-50%);
    display: grid; gap: 10px; justify-items: center; text-align: center;
  }
  #stageMsg p { margin: 0; font-size: 16px; line-height: 1.35; font-weight: 700; }
  #stageMsg .sub { font-size: 13px; font-weight: 400; color: var(--dim); }
  #stageMsg .sub:empty { display: none; }
  /* 아래에 더 있다는 표시 — 플레이어 상자 바로 밑(겹치지 않음) */
  .down {
    position: absolute; left: 50%; top: calc(50% + var(--player) / 2 + 1px);
    width: 18px; height: 10px; margin-left: -9px; opacity: .55; pointer-events: none;
  }

  /* 둘째 화면: 지금 곡(굵은 제목·회색 채널) + 큰 조작 버튼 + 진행 (둥근 화면 가운데에 오게 한 화면 높이) */
  .now {
    min-height: 100vh; min-height: 100dvh; padding: 20px 11%;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7px;
    text-align: center; scroll-snap-align: center;
  }
  #title {
    font-size: 18px; line-height: 1.25; font-weight: 700; margin: 0; max-width: 100%; letter-spacing: -0.2px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  #channel { font-size: 14px; color: var(--dim); margin: -3px 0 2px; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #channel:empty { display: none; }
  .ctl { display: flex; align-items: center; justify-content: center; gap: 12px; }
  .ctl button { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; flex: none; }
  .ctl button:active:not(:disabled) { background: var(--chip); }
  .ctl button svg { width: 34px; height: 34px; fill: currentColor; }
  /* 유튜브 뮤직의 큰 흰 재생 버튼 */
  .ctl #play { width: 68px; height: 68px; background: var(--primary); color: var(--on-primary); }
  .ctl #play:active:not(:disabled) { background: #d9d9d9; }
  .ctl #play svg { width: 38px; height: 38px; }
  .prog { width: 100%; display: grid; gap: 4px; justify-items: center; }
  .bar { width: 100%; height: 4px; border-radius: 2px; background: var(--track); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--fill); border-radius: 2px; }
  #time { font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; }
  #status { font-size: 13px; line-height: 1.35; color: var(--warn); margin: 0; max-width: 100%; }
  #status:empty { display: none; }
  #status.info { color: #e8e8e8; }
  .pill {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px;
    font-size: 15px; font-weight: 700; color: var(--fg); text-decoration: none;
    background: var(--card); border-radius: 24px; padding: 10px 18px;
  }
  .pill svg { width: 22px; height: 22px; fill: currentColor; flex: none; }
  .pill.accent { background: var(--primary); color: var(--on-primary); }

  /* 소리·한 곡 반복·잠자기 — 둥근 화면 어디서나 들어가게 두 줄 (줄마다 따로 가장자리 맞추기) */
  .more { display: grid; gap: 12px; justify-items: center; margin: 2px auto 20px; }
  .more .row { display: flex; gap: 16px; justify-content: center; }
  .more button { width: 52px; height: 52px; border-radius: 50%; background: var(--card); display: grid; place-items: center; flex: none; }
  .more button svg { width: 26px; height: 26px; fill: currentColor; }
  .more button[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); }
  /* 잠자기 타이머가 켜지면 아이콘 대신 남은 시간(분)을 크게 */
  #sleepTxt { display: none; font-size: 17px; font-weight: 700; line-height: 1; white-space: nowrap; }
  #sleepTxt::after { content: '분'; font-size: 11px; margin-left: 1px; }
  #sleep[aria-pressed="true"] svg { display: none; }
  #sleep[aria-pressed="true"] #sleepTxt { display: block; }

  /* 다음 곡 — 유튜브 규칙: 눌러서 재생을 시작하는 미리보기는 120×70 이상 → 124×70 세로 카드, 미리보기는 줄이지 않는다 */
  .next { padding: 4px 0 8px; }
  .next h2 { font-size: 16px; font-weight: 700; color: var(--fg); text-align: center; margin: 4px 0 10px; }
  .next ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; justify-items: center; }
  .next li { width: 100%; display: flex; justify-content: center; }
  .next li button {
    width: min(172px, 76vw); display: flex; flex-direction: column; align-items: center; gap: 6px;
    background: var(--card); border-radius: 18px; padding: 8px 8px 10px; text-align: center;
  }
  .next img { width: 124px; height: 70px; border-radius: 10px; object-fit: cover; flex: none; background: var(--chip); }
  .next .t {
    font-size: 14px; font-weight: 700; line-height: 1.3; max-width: 100%;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }

  .tail { padding: 10px 12% 44px; display: grid; gap: 10px; justify-items: center; text-align: center; }
  .tail p { font-size: 13px; line-height: 1.4; color: var(--dim); margin: 0; }
  /* 둥근 화면 위·아래 가장자리로 갈수록 작게(.fit) 또는 흐리게만(.fade) — 워치 목록처럼. 값은 스크립트가 넣는다 */
  .fit { transform-origin: 50% 50%; will-change: transform, opacity; }
  .fade { will-change: opacity; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <div class="stage" id="stage">
    <div id="player"></div>
    <div id="stageMsg" hidden>
      <p id="stageText"></p>
      <p class="sub" id="stageSub"></p>
      <button id="stageRetry" class="pill accent" type="button" hidden>다시 시도</button>
      <a id="stageFind" class="pill" href="intent://tube#Intent;scheme=kakaowatch;package=com.mywatch.kakaomap;end" hidden>동영상 찾기</a>
    </div>
    <svg class="down" viewBox="0 0 18 10" aria-hidden="true"><path d="M2 2l7 6 7-6" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
  </div>

  <section class="now" id="now">
    <p id="title" class="fit">불러오는 중…</p>
    <p id="channel" class="fit"></p>
    <div class="ctl fit">
      <button id="prev" type="button" aria-label="이전 동영상" disabled><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
      <button id="play" type="button" aria-label="재생" disabled><svg viewBox="0 0 24 24"><path id="playIcon" d="M8 5v14l11-7z"/></svg></button>
      <button id="next" type="button" aria-label="다음 동영상" disabled><svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
    </div>
    <div class="prog fit" id="prog" hidden>
      <div class="bar"><i id="fill"></i></div>
      <span id="time"></span>
    </div>
    <p id="status" class="fit" role="status"></p>
    <button id="retry" class="pill accent fit" type="button" hidden>다시 시도</button>
  </section>

  <div class="more">
   <div class="row fit">
    <button id="volDown" type="button" aria-label="소리 작게" disabled><svg viewBox="0 0 24 24"><path d="M18.5 12A4.5 4.5 0 0 0 16 7.97v8.05c1.48-.73 2.5-2.25 2.5-4.02zM5 9v6h4l5 5V4L9 9H5z"/></svg></button>
    <button id="volUp" type="button" aria-label="소리 크게" disabled><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg></button>
   </div>
   <div class="row fit">
    <button id="repeat" type="button" aria-label="반복 재생" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4zm-4-2V9h-1l-2 1v1h1.5v4H13z"/></svg></button>
    <button id="sleep" type="button" aria-label="잠자기 타이머 꺼짐" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M15 1H9v2h6V1zm-4 13h2V8h-2v6zm8.03-6.61 1.42-1.42c-.43-.51-.9-.99-1.41-1.41l-1.42 1.42A8.96 8.96 0 0 0 12 4c-4.97 0-9 4.03-9 9s4.02 9 9 9a8.994 8.994 0 0 0 7.03-14.61zM12 20c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/></svg><span id="sleepTxt"></span></button>
   </div>
  </div>

  <section class="next" id="upnext" hidden>
    <h2>다음 동영상</h2>
    <ol id="list"></ol>
  </section>

  <div class="tail">
    <button id="toPhone" class="pill fit" type="button" disabled><svg viewBox="0 0 24 24"><path d="M17 1.01 7 1c-1.1 0-2 .9-2 2v18c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V3c0-1.1-.9-1.99-2-1.99zM17 19H7V5h10v14z"/></svg>폰에서 이어 보기</button>
    <a id="back" class="pill fit" href="intent://tube#Intent;scheme=kakaowatch;package=com.mywatch.kakaomap;end"><svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg><span id="backText">다른 동영상 찾기</span></a>
    <p class="fit">로그인 없는 유튜브 플레이어예요. 화면이 켜져 있는 동안 나오고, 꺼지면 멈춰요.</p>
    <p class="fit">광고 없이·화면이 꺼져도 보려면(유튜브 프리미엄) ‘폰에서 이어 보기’를 눌러요.</p>
  </div>

<script>
(function () {
  'use strict';
  var ID = /^[A-Za-z0-9_-]{11}$/;
  var LIST = /^[A-Za-z0-9_-]{2,64}$/;   // 재생목록 번호 (PL…·UU…·OLAK5uy_… 등)
  var MAX_IDS = 50;                     // 앱이 넘기는 목록은 처음 동영상까지 50개
  var APP = 'com.mywatch.kakaomap';
  var PLAY_D = 'M8 5v14l11-7z';
  var PAUSE_D = 'M6 19h4V5H6v14zm8-14v14h4V5h-4z';
  var UPNEXT = 5;
  var VISIBLE = 0.9;          // 플레이어 상자가 이만큼 보여야 재생 시작 — 둥근 화면에서도 절반이 넘게 보이도록
  var SKIP_MS = 2500;         // 막힌 곡을 알리고 다음 곡으로 넘어가기까지
  var MAX_ERRORS = 6;         // 연달아 이만큼 막히면 멈춘다 (전부 막힌 목록을 끝없이 넘기지 않게)
  var SLOW_MS = 15000;        // 이만큼 불러오기만 하면 '인터넷이 느려요' (그동안만 화면을 켜 둠)
  var API_WAIT_MS = 15000;    // 유튜브 플레이어 스크립트를 이만큼 기다린다
  // 화면이 켜진 채 이만큼 기다려도 플레이어가 준비되지 않으면 '다시 시도' (화면이 꺼진 동안은 세지 않음 — 꺼지면 브라우저가 멈춤)
  var READY_MS = window.__kwReadyMs || 20000;
  // 멈춘 뒤 화면이 켜진 채 이만큼 플레이어가 아무것도 안 불러오면 멈춤이 먹힌 것 (그때부터 플레이어를 직접 눌러 틀어도 됨)
  var HOLD_IDLE_MS = SLOW_MS;
  var SLOW_PLAYER = '플레이어를 불러오지 못했어요 · 인터넷 연결을 확인하고 다시 시도해 주세요';
  // 앱에서 고른 지 이만큼 안 됐으면 바로 튼다 (뒤로 가기·나중에 되살아난 탭·새로 고침은 ▶ 를 기다림). 시뮬레이터는 짧게
  var FRESH_MS = window.__kwFreshMs || 5 * 60000;
  var VOL_STEP = 10;
  var SLEEP_STEPS = [0, 15, 30, 60];   // 잠자기 타이머 (분) — 누를 때마다 다음
  var MINUTE = window.__kwMinuteMs || 60000;   // 시뮬레이터는 1분을 짧게
  var ERRORS = {
    2: '영상 주소가 잘못됐어요',
    5: '이 워치 브라우저에서 틀 수 없는 영상이에요',
    100: '지워졌거나 비공개인 영상이에요',
    101: '올린 사람이 다른 곳 재생을 막아 둔 동영상이에요',
    150: '올린 사람이 다른 곳 재생을 막아 둔 동영상이에요'
  };
  var S = { UNSTARTED: -1, ENDED: 0, PLAYING: 1, PAUSED: 2, BUFFERING: 3, CUED: 5 };

  var $ = function (id) { return document.getElementById(id); };
  // 다른 앱(워치 앱)으로 보내는 링크 — 시뮬레이터는 window.__kwNavigate 로 가로챈다
  function navigate(url) {
    if (typeof window.__kwNavigate === 'function') { window.__kwNavigate(url); return; }
    location.href = url;
  }
  function report(e) { if (window.console && console.warn) console.warn('[워치 유튜브]', e); }

  // ---------- 여러 곡에 걸친 것 ----------
  var titles = {};             // 영상 번호 → {title, author}
  var pending = {};            // 곡 이름을 받는 중
  var repeat = readRepeat();
  var volume = null;           // 우리가 아는 소리 크기 (빠르게 여러 번 눌러도 맞게)
  var wake = null;
  var wakePending = false;
  var apiReady = false;
  var apiDead = false;         // 유튜브 플레이어 스크립트를 끝내 못 받음 (인터넷이 돌아오면 새로 고침)
  var apiTimer = 0;
  var fitQueued = false;
  var sleepMin = 0;
  var sleepTimer = 0;
  var newest = readNewest();   // 이 탭이 받은 가장 최근 '고른 시각' (앱이 n= 으로 붙인다) — 새로 고쳐져도 기억
  var flashBack = null;        // 잠깐 알림(소리 등) 전에 있던 안내 — 알림이 끝나면 되돌린다

  // ---------- 지금 연 곡 (load 마다 새로) ----------
  var player = null;
  var session = 0;             // load 마다 늘어남 — 예전 곡에 걸어 둔 일은 버린다
  var cur = null;
  var timers = { hint: 0, skip: 0, slow: 0, prog: 0, msg: 0, wait: 0, bridge: 0, cont: 0, ready: 0, keep: 0, hold: 0 };
  var waiters = [];
  var statusAt = 0;
  var statusKeep = false;

  function readRepeat() { try { return localStorage.getItem('kw.repeat') === '1'; } catch (e) { return false; } }
  function saveRepeat() { try { localStorage.setItem('kw.repeat', repeat ? '1' : '0'); } catch (e) {} }
  function readNewest() { try { return Math.max(0, +(sessionStorage.getItem('kw.newest') || 0) || 0); } catch (e) { return 0; } }
  function saveNewest() { try { sessionStorage.setItem('kw.newest', String(newest)); } catch (e) {} }

  // 밖에서 온 글: 글자 방향을 뒤집거나 안 보이게 끼우는 글자는 빼고, 제어 문자는 띄어쓰기로, 띄어쓰기는 하나로, 글자 수로 자르기
  function clean(s, max) {

    var my = session;
    clearTimeout(timers.hint);
    timers.hint = setTimeout(function () {
      // 브라우저가 소리 자동 재생을 막았거나(그대로 멈춰 있음) 예전 주소라 저절로 안 틀면 → 플레이어 가운데 ▶ 로 시작
      if (my === session && cur && cur.ready && !cur.started && (cur.state === null || cur.state === S.UNSTARTED || cur.state === S.CUED) && !$('status').textContent) {
        status(document.visibilityState === 'visible' ? '플레이어 가운데 ▶ 를 눌러 시작하세요' : '▶ 를 눌러 재생해요', 'info');
      }
    }, 2500);
  }

  // 브라우저가 소리 자동 재생을 막음 — 기다리지 않고 바로 '▶ 를 눌러' 안내 (없는 플레이어 버전이면 2.5초 뒤 안내가 대신)
  function onAutoplayBlocked() {
    if (!cur || !cur.ready) return;
    clearTimeout(timers.hint);
    clearTimeout(timers.slow);   // 막혀서 멈춘 것 — '인터넷이 느려요'가 아니다
    timers.slow = 0;
    bridge(false);
    if (cur.playing && cur.state !== S.PLAYING) setPlaying(false);
    if (!cur.started) status(document.visibilityState === 'visible' ? '플레이어 가운데 ▶ 를 눌러 시작하세요' : '▶ 를 눌러 재생해요', 'info');
    else status('▶ 를 눌러 이어서 재생해요', 'info');
  }

  function armSlow() {
    if (timers.slow) return;
    var my = session;
    timers.slow = setTimeout(function () {
      timers.slow = 0;
      if (my !== session || !cur || cur.state === S.PLAYING || cur.state === S.PAUSED) return;
      // 오래 기다리면 화면을 켜 두지 않는다 (배터리)
      var loading = cur.state === S.BUFFERING;
      cur.bridge = false;
      clearTimeout(timers.bridge);
      timers.bridge = 0;
      setPlaying(false);
      status(navigator.onLine === false ? '인터넷 연결이 끊겼어요' : (loading ? '인터넷이 느려서 불러오는 중이에요…' : '▶ 를 눌러 이어서 재생해요'), 'info');
    }, SLOW_MS);
  }

  function onStateChange(e) {
    if (!cur || !cur.ready) return;
    var s = e.data;
    var idx = index();
    var prev = cur.state;
    cur.state = s;
    // 재생 중 같은 곡이 잠깐 끊겨 다시 받는 중 (그 뒤 다시 재생돼도 '새로 시작'이 아니다)
    if (s === S.BUFFERING) cur.rebuffer = cur.rebuffer || (prev === S.PLAYING && idx === cur.playingIndex);
    else if (s !== S.PLAYING) cur.rebuffer = false;
    if (s === S.PLAYING || s === S.PAUSED || s === S.ENDED || s === S.CUED) { clearTimeout(timers.slow); timers.slow = 0; }
    if (s === S.PAUSED || s === S.ENDED || s === S.CUED) { cur.hold = false; clearTimeout(timers.hold); timers.hold = 0; }   // 플레이어가 멈춤을 받았다
    else if (cur.hold) holdIdle();   // 아직 불러오는 중이면 기다림을 새로

    // 목록이 저절로 다음 곡으로 넘어가려 함 (실제 플레이어는 '끝남' 없이 바로 다음 번호를 불러온다)
    var moved = cur.playingIndex >= 0 && idx >= 0 && idx !== cur.playingIndex;
    if (moved && !cur.userJump && (s === S.BUFFERING || s === S.UNSTARTED)) {
      if (repeat) {   // 한 곡 반복: 같은 곡으로 되돌린다
        var back = cur.playingIndex;
        cur.userJump = true;
        whenVisible(function () { bridge(true); player.playVideoAt(back); }, true);
        return;
      }
      if (document.visibilityState !== 'visible') { cur.hiddenPause = true; pauseNow(); return; }
      // 이어 받은 믹스에 방금 들은 곡이 또 나오면 한 번 건너뛴다
      if (cur.avoid && currentId() === cur.avoid) {
        cur.avoid = null;
        cur.userJump = true;
        if (idx < playlist().length - 1) whenVisible(function () { bridge(true); player.nextVideo(); }, true);
        else continueMix(false);
        return;
      }
      if (!playerVisible()) showPlayer(false);   // 새 곡이 시작되기 전에 플레이어가 보이게
    }

    if (s === S.PLAYING) {
      if (cur.hold) { safe('pauseVideo'); return; }   // 멈췄는데 불러오던 곡이 시작됨(멈춤을 놓침) → 다시 멈춤
      if (document.visibilityState !== 'visible') {
        // 화면이 꺼진 채 시작됨 → 멈춤. 방금 고른 곡이 아직 한 번도 안 나왔으면 (고른 지 얼마 안 됐을 때) 보이게 될 때 시작
        if (!cur.started && autoStartOk()) cur.autoStart = true; else cur.hiddenPause = true;
        pauseNow();
        return;
      }
      // 새로 시작(처음·다음 곡·끝난 곡 다시·멈췄다 다시)이면 플레이어가 보여야 한다. 재생 중 잠깐 끊겼다 이어지는 건 그대로
      var starting = !cur.rebuffer || idx !== cur.playingIndex;
      cur.rebuffer = false;
      if (starting && !playerVisible()) {
        // 보이지 않는 채로 재생이 시작됐다 → 멈추고 플레이어를 보이게 한 뒤 다시 (유튜브 규칙)
        pauseNow();
        cur.userJump = true;
        whenVisible(function () { player.playVideo(); }, true);
        return;
      }
      cur.started = true;
      cur.listDone = false;
      cur.userJump = false;
      cur.hiddenPause = false;
      cur.autoStart = false;
      cur.resume = null;
      cur.blockedIdx = -1;
      cur.errorsInRow = 0;
      cur.continued = 0;
      cur.playingIndex = idx;
      cur.lastId = currentId();
      cur.bridge = false;
      clearTimeout(timers.bridge);
      timers.bridge = 0;
      clearTimeout(timers.skip);
      timers.skip = 0;
      clearTimeout(timers.hint);
      if (!statusKeep || Date.now() - statusAt > 3000) status('');
      else {   // 잠깐 남겨 두기로 한 안내 ('비슷한 곡을 이어서 틀어요' 등) — 3초가 되면 거둔다
        var kept = $('status').textContent;
        clearTimeout(timers.keep);
        timers.keep = setTimeout(function () { if ($('status').textContent === kept) status(''); }, 3000 - (Date.now() - statusAt));
      }

      refreshNow();
      return;
    }
    if (s === S.PAUSED) {
      setPlaying(false);
    } else if (s === S.ENDED) {
      var ids = playlist();
      if (repeat) {
        cur.userJump = true;
        bridge(true);
        setPlaying(false);
        whenVisible(function () {
          bridge(true);
          if (ids.length > 1 && idx >= 0) player.playVideoAt(idx);
          else { player.seekTo(0, true); player.playVideo(); }
        }, true);
      } else if (ids.length > 1 && idx >= ids.length - 1 && isMix()) {
        continueMix(false);
        setPlaying(false);
      } else {
        setPlaying(false);
        if (ids.length > 1 && idx >= ids.length - 1) { cur.listDone = true; status('목록이 끝났어요 · ▶ 를 누르면 처음부터', 'info'); }
        else if (ids.length <= 1) status('끝났어요 · ▶ 를 누르면 처음부터', 'info');
      }
    } else if (s === S.BUFFERING) {
      armSlow();
    } else if (s === S.CUED) {
      if (cur.playing) setPlaying(false);   // 대기 중엔 재생이 아님 (넘어가는 중이면 화면은 그대로 켜 둠)
      if (cur.continuing) {   // 이어 들을 믹스를 받았음 → 방금 들은 곡이 아닌 곡부터
        var from = cur.continuing;
        endContinue();
        cur.avoid = from;
        var list = playlist();
        var start = 0;
        while (start < list.length - 1 && list[start] === from) start++;
        cur.userJump = true;
        cur.playingIndex = -1;
        cur.shownIndex = -1;
        if (!list.length) {
          bridge(false);
          status('비슷한 동영상을 못 찾았어요 · 다른 동영상을 찾아 보세요', 'info');
        } else {
          whenVisible(function () { bridge(true); player.playVideoAt(start); }, true);
        }
      }
      refreshNow();
    } else if (s === S.UNSTARTED) {
      if (cur.playing || cur.bridge) armSlow();
      refreshNow();
    }
    refreshButtons();
  }

  function onError(e) {
    if (!cur || !cur.ready) return;
    var code = e && e.data;
    clearTimeout(timers.slow);
    timers.slow = 0;
    var held = cur.hold;   // 사용자가 멈춘 뒤 불러오던 곡이 막힘
    cur.hold = false;
    var ids = playlist();
    var at = index();
    cur.errorsInRow++;
    cur.blockedIdx = at;
    if (cur.continuing) {
      endContinue();
      bridge(false);
      setPlaying(false);
      status('비슷한 동영상을 못 찾았어요 · 다른 동영상을 찾아 보세요', 'info');
      refreshButtons();
      return;
    }
    // 믹스 설정 때문에 열리지 않은 듯하면(설정값 오류) 이 곡만으로 한 번 더. 곡 자체가 막힌 경우(100·101·150)는 그대로 알린다
    if (isMix() && !cur.triedSingle && ids.length === 0 && (code === 2 || code === 5)) {
      var p0 = cur.p, f0 = cur.fresh && !held, my = session;
      cur.triedSingle = true;
      // 플레이어 자신의 알림 안에서 그 플레이어를 없애지 않게 다음 차례에
      setTimeout(function () {
        if (my === session) load({ v: p0.v, mode: 'single', mix: false, ids: [], list: null, t: p0.t, c: p0.c, n: p0.n, app: p0.app }, { triedSingle: true, fresh: f0, note: '믹스를 못 불러와서 이 동영상만 틀어요' });
      }, 0);
      return;
    }
    var msg = ERRORS[code] || ('재생하지 못했어요 (오류 ' + code + ')');
    if (held) {
      // 멈춘 뒤라 저절로 넘어가지 않는다 — ▶ 를 누르면 다음 곡으로
      bridge(false);
      setPlaying(false);
      if (ids.length > 1 && at >= 0) later(skipBlocked);
    } else if (cur.errorsInRow >= MAX_ERRORS) {
      bridge(false);
      setPlaying(false);
      status('못 트는 동영상이 많아서 멈췄어요 · ⏭ 로 넘기거나 다른 동영상을 찾아 보세요');
    } else if (ids.length > 1 && at >= 0 && (at < ids.length - 1 || isMix())) {
      // 다음 동영상으로 (믹스의 끝이면 비슷한 동영상 믹스로) — 그동안 화면을 켜 둔다
      bridge(true);
      setPlaying(false);
      status(msg + (at < ids.length - 1 ? ' · 다음 동영상으로 넘어가요' : ' · 비슷한 동영상을 이어서 찾아요'));
      clearTimeout(timers.skip);
      timers.skip = setTimeout(function () { timers.skip = 0; skipBlocked(); }, SKIP_MS);
    } else {
      bridge(false);
      setPlaying(false);
      status(msg + (ids.length > 1 && at >= ids.length - 1 ? ' · 목록이 끝났어요' : ''));
    }
    refreshButtons();
  }

  // 막힌 곡 다음으로: 목록 중간이면 다음 곡, 끝이면 비슷한 곡 믹스
  function skipBlocked() {
    if (!cur || !cur.ready || !player) return;
    var ids = playlist(), at = index();
    cur.userJump = true;
    if (ids.length > 1 && at >= 0 && at < ids.length - 1) whenVisible(function () { status(''); bridge(true); player.nextVideo(); }, true);
    else if (ids.length > 1 && isMix()) continueMix(false);
  }

  // 믹스 끝(또는 끝에서 ⏭): 마지막으로 들은 곡으로 새 믹스를 받아 이어서 (같은 플레이어 — 받은 뒤 방금 들은 곡이 아닌 곡부터)
  function continueMix(byUser) {
    if (!cur || !cur.ready || !player) return;
    if (byUser) cur.continued = 0;
    // 씨앗 = 마지막으로 실제 재생된 곡 (마지막 곡이 막혔으면 그 앞 곡)
    var last = cur.lastId || currentId();
    if (!last || cur.continued >= 2) {
      bridge(false);
      status('믹스가 끝났어요 · 다른 동영상을 찾아 보세요', 'info');
      return;
    }
    if (document.visibilityState !== 'visible') { later(function () { continueMix(true); }); return; }
    cur.continued++;
    cur.continuing = last;
    cur.userJump = true;
    bridge(true);
    status(byUser ? '비슷한 동영상을 이어서 틀어요' : '믹스가 끝났어요 · 비슷한 동영상을 이어서 틀어요', 'info', true);
    var my = session;
    clearTimeout(timers.cont);
    timers.cont = setTimeout(function () {   // 비슷한 곡 목록이 끝내 안 옴
      timers.cont = 0;
      if (my !== session || !cur || !cur.continuing) return;
      endContinue();
      bridge(false);
      status('비슷한 동영상을 못 찾았어요 · 다른 동영상을 찾아 보세요', 'info');
      refreshButtons();
    }, SLOW_MS);
    try { player.cuePlaylist({ list: 'RD' + last, listType: 'playlist', index: 0 }); } catch (e) { endContinue(); bridge(false); report(e); }
  }

  function safe(name) { try { if (player) player[name](); } catch (e) { report(e); } }

  // 사용자가 곡을 직접 고름 (⏭·⏮·다음 곡 카드): 저절로 하던 일은 그만
  function userChoice() {
    clearWaiters();   // 마지막으로 누른 것만
    cur.userJump = true;
    cur.resume = null;
    cur.autoStart = false;
    clearTimeout(timers.skip);
    timers.skip = 0;
    status('');
  }

  // ---------- 곡 열기 ----------
  function clearTimers() {
    clearTimeout(timers.hint);
    clearTimeout(timers.skip);
    clearTimeout(timers.slow);
    clearInterval(timers.prog);
    clearTimeout(timers.msg);
    clearTimeout(timers.bridge);
    clearTimeout(timers.cont);
    clearTimeout(timers.ready);
    clearTimeout(timers.keep);
    clearTimeout(timers.hold);
    timers.hint = timers.skip = timers.slow = timers.prog = timers.msg = timers.bridge = timers.cont = timers.ready = timers.keep = timers.hold = 0;
    flashBack = null;
    clearWaiters();
  }
  function destroyPlayer() {
    if (!player) return;
    var p = player;
    player = null;
    try { p.destroy(); } catch (e) { report(e); }
    if (!$('player')) {   // destroy 가 자리를 못 돌려놓았으면 다시 만든다
      var host = document.createElement('div');
      host.id = 'player';
      $('stage').insertBefore(host, $('stage').firstChild);
    }
  }

  function load(p, opts) {
    opts = opts || {};
    session++;
    clearTimers();
    destroyPlayer();
    var visible = document.visibilityState === 'visible';
    var fresh = !!p && (opts.fresh != null ? !!opts.fresh : freshPick(p));
    cur = {
      p: p, ready: false, playing: false, state: null, started: false,
      playingIndex: -1, shownIndex: -1, userJump: true, errorsInRow: 0, continued: 0, continuing: null,
      triedSingle: !!opts.triedSingle, hiddenPause: false, lastId: null, titleFor: null, avoid: null, rebuffer: false,
      fresh: fresh, pickedAt: (p && p.n) || Date.now(), autoStart: false, hold: false, bridge: false, resume: null,
      blockedIdx: -1, failed: false, noAuto: false
    };
    setPlaying(false);
    $('upnext').hidden = true;
    $('list').textContent = '';
    $('retry').hidden = true;
    // 아래를 보고 있었어도 플레이어가 보이는 맨 위에서 시작 (자동 재생은 보일 때만)
    window.scrollTo(0, 0);
    if (!p) {
      cur = null;
      setNow('볼 동영상이 없어요', '');
      status('워치 앱 ‘유튜브’에서 고른 동영상이 여기서 재생돼요', 'info');
      stageMsg('볼 동영상이 없어요', '워치 앱에서 동영상을 골라 주세요', false, true);
      refreshButtons();
      return;
    }
    stageMsg('');
    status(opts.note || '', 'info', !!opts.note);
    // 주소에 온 곡 이름은 먼저 보여 주기만 — 유튜브가 알려 주는 이름(oEmbed)이 오면 그것으로
    setNow(p.t || '불러오는 중…', p.c);
    refreshButtons();
    var vars = {
      playsinline: 1,
      // 저절로 틀지 않는다 — 준비되면 우리가 정한다 (onReady: 방금 고른 곡이고 화면이 켜져 있을 때만)
      autoplay: 0,
      // 플레이어 아래쪽 조작 막대는 둥근 화면 가장자리에 잘린다 → 숨기고(문서에 있는 설정) 아래에 큰 버튼을 둔다
      controls: 0,
      rel: 0,
      iv_load_policy: 3,
      origin: location.origin
    };
    // 믹스: 이 동영상으로 시작해 유튜브가 비슷한 동영상을 이어 주는 재생목록
    if (p.mode === 'mix') vars.list = 'RD' + p.v;
    // 앱의 목록: 실제 플레이어는 playlist 가 있으면 videoId 를 무시하고 이 목록만 튼다(2026-10 확인) → 처음 동영상을 맨 앞에
    else if (p.mode === 'ids') vars.playlist = [p.v].concat(p.ids).join(',');
    // 재생목록: videoId 가 목록에 있으면 그 자리부터 (실제 확인)
    else if (p.mode === 'list') { vars.list = p.list; vars.listType = 'playlist'; }
    var me = null;
    try {

        height: 200,
        videoId: p.v,
        playerVars: vars,

          onStateChange: function (e) { if (player === me) onStateChange(e); },
          onError: function (e) { if (player === me) onError(e); },
          onAutoplayBlocked: function () { if (player === me) onAutoplayBlocked(); }
        }
      });
    } catch (e) {
      report(e);
      player = null;
      apiFailed();
      return;
    }
    armReady();
  }

  // 플레이어가 끝내 준비되지 않으면 (인터넷이 끊겼다 등) 갇히지 않게 '다시 시도'. 화면이 켜져 있는 시간만 센다
  function armReady() {
    clearTimeout(timers.ready);
    timers.ready = 0;
    if (!cur || cur.ready || cur.failed || !player || document.visibilityState !== 'visible') return;
    var my = session;
    timers.ready = setTimeout(function () {
      timers.ready = 0;
      if (my !== session || !cur || cur.ready) return;
      if (document.visibilityState !== 'visible') return;   // 켜지면 다시 센다
      // 플레이어는 그대로 둔다 (늦게라도 준비되면 안내가 사라짐) — 안내와 '다시 시도'가 보이게 내려 준다
      cur.failed = true;
      status(SLOW_PLAYER);
      $('retry').hidden = false;
      $('now').scrollIntoView({ block: 'center' });
      refreshButtons();
    }, READY_MS);
  }

  // 유튜브 플레이어 스크립트를 기다린다 — 화면이 켜져 있는 시간만 센다 (꺼지면 브라우저가 멈춰 시간이 한꺼번에 지남)
  function armApi() {
    clearTimeout(apiTimer);
    apiTimer = 0;
    if (apiReady || apiDead || document.visibilityState !== 'visible') return;
    apiTimer = setTimeout(function () {
      apiTimer = 0;
      if (apiReady || document.visibilityState !== 'visible') return;   // 켜지면 다시 센다
      apiFailed();
    }, API_WAIT_MS);
  }

  function apiFailed() {
    if (player) return;
    apiDead = true;
    setNow('유튜브에 연결하지 못했어요', '');
    status('인터넷 연결을 확인하고 다시 시도해 주세요');
    stageMsg('유튜브에 연결하지 못했어요', '인터넷 연결을 확인해 주세요', true, false);
    $('retry').hidden = false;
    refreshButtons();
  }

  // ---------- 버튼 ----------
  $('play').addEventListener('click', function () {
    if (!cur || !cur.ready || !player) { status('불러오는 중이에요…', 'info'); return; }
    if (cur.playing) { cur.hiddenPause = false; stopAll(); return; }
    cur.hiddenPause = false;
    cur.autoStart = false;
    if (cur.continuing) { status('비슷한 동영상을 찾는 중이에요…', 'info'); return; }
    if (cur.errorsInRow >= MAX_ERRORS) cur.errorsInRow = 0;
    status('');
    dropWaiters();   // 보이면 하려던 일(저절로 넘어가기)이 있으면 아래에서 그것을 이어서
    // 막힌 곡을 건너뛰려던 중·화면이 꺼져 못 한 일이 있으면 그것부터 (막힌 곡을 다시 틀지 않게)
    if (timers.skip) { clearTimeout(timers.skip); timers.skip = 0; skipBlocked(); return; }
    if (cur.resume) { var r = cur.resume; cur.resume = null; whenVisible(r); return; }
    if (cur.blockedIdx >= 0 && index() === cur.blockedIdx && playlist().length > 1) {
      if (index() >= playlist().length - 1 && !isMix()) whenVisible(function () { bridge(true); player.playVideoAt(0); });
      else skipBlocked();
      return;
    }
    whenVisible(function () {
      if (cur.state === S.ENDED && cur.listDone && playlist().length > 1) { cur.listDone = false; bridge(true); player.playVideoAt(0); return; }
      if (cur.state === S.ENDED && playlist().length <= 1) player.seekTo(0, true);
      player.playVideo();
    });
  });
  $('prev').addEventListener('click', function () {
    if (!cur || !cur.ready) return;
    userChoice();
    whenVisible(function () {
      bridge(true);
      if (playlist().length > 1 && index() > 0) player.previousVideo();
      else { player.seekTo(0, true); player.playVideo(); }
    });
  });
  $('next').addEventListener('click', function () {
    if (!cur || !cur.ready) return;
    userChoice();
    var ids = playlist();
    if (ids.length > 1 && index() === ids.length - 1) { if (isMix()) continueMix(true); return; }   // 믹스 끝 → 비슷한 동영상 믹스
    whenVisible(function () { bridge(true); player.nextVideo(); });
  });
  function changeVolume(d) {
    if (!cur || !cur.ready || !player) return;
    try {
      if (player.isMuted()) player.unMute();
      var v = volume == null ? player.getVolume() : volume;
      v = Math.max(0, Math.min(100, Math.round((+v || 0) + d)));
      player.setVolume(v);
      volume = v;
      flash(v === 0 ? '소리 0 (꺼짐)' : '소리 ' + v);
    } catch (e) { report(e); }
  }
  $('volDown').addEventListener('click', function () { changeVolume(-VOL_STEP); });
  $('volUp').addEventListener('click', function () { changeVolume(VOL_STEP); });
  $('repeat').addEventListener('click', function () {
    repeat = !repeat;
    saveRepeat();
    refreshButtons();
    flash(repeat ? '반복 재생 켬' : '반복 재생 끔');
  });
  // 폰에서 이어 듣기: 워치 앱에 '폰 유튜브에서 이 곡을 이 시각부터' 를 맡긴다 (앱이 한 번 더 묻고 연다)
  $('toPhone').addEventListener('click', function () {
    if (!cur || !cur.p) return;
    var id = currentId() || cur.p.v;
    var t = 0;
    if (cur.ready && player) { try { t = Math.floor(player.getCurrentTime() || 0); } catch (e) {} }
    stopAll();
    var ti = titles[id] || (id === cur.p.v ? { title: cur.p.t, author: cur.p.c } : {});
    var path = 'tube/phone?v=' + id + '&t=' + t + (cur.p.mix ? '&mix=1' : '') + (cur.p.list ? '&list=' + cur.p.list : '') +
      (ti.title ? '&title=' + encodeURIComponent(clean(ti.title, 100)) : '') +
      (ti.author ? '&channel=' + encodeURIComponent(clean(ti.author, 40)) : '');
    navigate(appLink(path, cur.p.app));
  });
  // 잠자기 타이머: 정한 시간이 지나면 멈춘다 (곡을 바꿔도 이어짐). 화면이 켜진 채 오래 틀어 두지 않게
  function setSleep(min) {
    sleepMin = min;
    clearTimeout(sleepTimer);
    sleepTimer = 0;
    var b = $('sleep');
    b.setAttribute('aria-pressed', min ? 'true' : 'false');
    b.setAttribute('aria-label', min ? '잠자기 타이머 ' + min + '분' : '잠자기 타이머 꺼짐');
    $('sleepTxt').textContent = min ? String(min) : '';
    if (min) {
      sleepTimer = setTimeout(function () {
        setSleep(0);
        if (cur) {
          stopAll();
          cur.resume = null;
        }
        status('잠자기 타이머로 멈췄어요', 'info');
      }, min * MINUTE);
    }
  }
  $('sleep').addEventListener('click', function () {
    var next = SLEEP_STEPS[(SLEEP_STEPS.indexOf(sleepMin) + 1) % SLEEP_STEPS.length];
    setSleep(next);
    flash(next ? next + '분 뒤에 멈춰요' : '잠자기 타이머 끔');
  });
  $('retry').addEventListener('click', function () { location.reload(); });
  $('stageRetry').addEventListener('click', function () { location.reload(); });

  // ---------- 페이지 ----------
  // 유튜브 규칙: 보이지 않는 플레이어로 재생하지 않는다 → 화면이 꺼지거나 다른 앱으로 가면 멈춤, 돌아오면 ▶ 로 이어 듣기
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden') {
      clearTimeout(timers.ready);   // 꺼진 동안은 '준비 기다림'·'스크립트 기다림'을 세지 않는다
      timers.ready = 0;
      clearTimeout(apiTimer);
      apiTimer = 0;
      dropWaiters();
      if (cur && timers.skip) {   // 막힌 곡을 건너뛰려던 중 → ▶ 로 이어서
        clearTimeout(timers.skip);
        timers.skip = 0;
        later(skipBlocked);
      }
      if (cur && cur.continuing) {   // 비슷한 곡을 받던 중 → ▶ 로 이어서
        endContinue();
        later(function () { continueMix(true); });
      }
      if (cur && cur.ready && player && (cur.playing || cur.state === S.BUFFERING)) {
        // 방금 고른 곡이 아직 안 나왔으면 화면이 켜질 때 시작, 듣던 중이면 멈춤 (돌아와도 저절로 안 틂).
        // 이미 멈춘 뒤(사용자·잠자기·폰으로)면 그대로 멈춤만
        if (!cur.hold) {
          if (!cur.started && autoStartOk()) cur.autoStart = true; else cur.hiddenPause = true;
        }
        pauseNow();
      }
      if (cur) bridge(false);
      keepAwake(false);
    } else if (!apiReady) {
      armApi();   // 아직 스크립트를 기다리는 중 — 켜진 지금부터 다시 센다
    } else if (cur) {
      if (cur.autoStart && autoStartOk()) {
        // 방금 고른 곡 → 지금 시작 (플레이어가 아직 준비 중이면 준비되는 대로 onReady 가 시작)
        if (cur.ready) {
          cur.autoStart = false;
          whenVisible(function () { player.playVideo(); }, true);
        }
      } else if (cur.hiddenPause || cur.resume || cur.autoStart) {
        // 화면이 꺼졌거나 다른 앱으로 가서 멈춤 — 돌아와도 저절로 틀지 않는다
        cur.hiddenPause = false;
        cur.autoStart = false;
        status('멈췄어요 · ▶ 로 이어서 재생해요', 'info');
      }
      if (cur.hold) holdIdle();   // 멈춤이 먹혔는지는 켜진 뒤부터 센다
      armReady();
      syncAwake();
    }
  });
  // 뒤로 가기 저장소(bfcache)에서 돌아오면 플레이어의 실제 상태로 맞춘다
  window.addEventListener('pageshow', function (e) {
    if (!e.persisted || !cur || !cur.ready || !player) return;
    try { if (player.getPlayerState() !== S.PLAYING) setPlaying(false); } catch (x) {}
    refreshButtons();
  });
  window.addEventListener('offline', function () { status('인터넷 연결이 끊겼어요'); });
  window.addEventListener('online', function () {
    if (apiDead) { location.reload(); return; }   // 유튜브 스크립트를 못 받았던 화면 → 새로
    if (cur && cur.failed) { load(cur.p, { fresh: autoStartOk() }); return; }   // 못 불러온 플레이어 → 다시
    if (cur && cur.ready && !cur.playing) status('다시 연결됐어요 · ▶ 로 이어서 재생해요', 'info');
    else status('');
  });
  // 워치 앱에서 다른 곡을 고르면 같은 탭의 주소(#…)만 바뀐다 (같은 곡이어도 n= 이 달라 바뀜).
  // 뒤로 가기로 예전 곡 주소가 와도 바뀌는데, 그건 저절로 틀지 않는다 (freshPick)
  window.addEventListener('hashchange', function () {
    var p = params();
    setApp(!!(p && p.app));
    if (apiReady) load(p);
  });
  // 워치 앱 안(GeckoView)에서 열었으면 아래 링크는 앱의 목록으로 돌아간다
  function setApp(app) {
    $('back').setAttribute('href', appLink('tube', app));
    $('backText').textContent = app ? '목록으로' : '다른 동영상 찾기';
    $('stageFind').setAttribute('href', appLink('tube', app));
  }

  window.onYouTubeIframeAPIReady = function () {
    apiReady = true;
    apiDead = false;   // 늦게라도 왔다 — '못 받음'(인터넷이 돌아오면 새로 고침)을 거둔다
    clearTimeout(apiTimer);
    apiTimer = 0;
    load(params());
  };

  try { history.scrollRestoration = 'manual'; } catch (e) {}
  window.addEventListener('load', fitSoon);
  window.addEventListener('pageshow', fitSoon);
  $('repeat').setAttribute('aria-pressed', repeat ? 'true' : 'false');
  var first = params();
  if (!first) { setNow('볼 동영상이 없어요', ''); stageMsg('볼 동영상이 없어요', '워치 앱에서 동영상을 골라 주세요', false, true); }
  setApp(!!(first && first.app));
  fitSoon();
  var s = document.createElement('script');
  s.src = 'https://www.youtube.com/iframe_api';
  s.onerror = function () { clearTimeout(apiTimer); apiTimer = 0; apiFailed(); };
  document.head.appendChild(s);
  armApi();
}());
</script>
</body>
</html>
