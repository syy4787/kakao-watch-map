<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- 화면 폭을 480 으로 고정(갤럭시워치 44mm 화면과 1:1): 플레이어 칸은 세로(9:16) 229×407 — 모서리까지 둥근 화면 안에 들어가는
     가장 큰 크기(200×200 이상, 스크립트가 화면에 맞춰 정함). 칸 왼쪽 빈 곳 = 안내 글, 오른쪽 = 채널 단추 -->
<meta name="viewport" content="width=480, viewport-fit=cover">
<!-- 유튜브 임베드는 Referer 로 어디서 트는지 확인한다(없으면 153 오류) — 기본값을 그대로 쓴다고 못 박아 둔다 -->
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<!-- 워치 앱이 이 화면에 닿는지 확인할 때 찾는 표시 -->
<meta name="kakaowatch-player" content="1">
<title>워치 Shorts</title>
<style>
  /*
   * 갤럭시워치(둥근 화면)용 Shorts 재생 화면: 한 Shorts = 화면 한 장, 위아래로 넘기면(손가락·베젤) 한 장씩.
   * 장 = 가운데 세로 칸(지금 장만 유튜브 공식 플레이어, 다른 장은 미리보기 그림 — 둥근 화면 높이 가득) + 칸 왼쪽 빈 곳(안내 글) +
   * 오른쪽 빈 곳(채널 단추). 제목은 유튜브 플레이어 위 줄이 보여 주고, 장 이름(읽어 주기)으로도 둔다.
   * 플레이어 앞에는 아무것도 겹치지 않는다. 장 맞추기는 스크립트가 한다 (CSS scroll-snap 은 스크립트와 싸워서 쓰지 않음).
   * 무엇을 볼지 (# 뒤): ids=Shorts 번호들(50개까지) · i=처음 볼 자리 · n=앱에서 고른 시각 · app=1 (워치 앱 안)
   */
  :root {
    --bg: #000;
    --fg: #fff;
    --dim: #aaa;
    --card: #1f1f1f;
    --chip: #2a2a2a;
    --primary: #fff;
    --on-primary: #0f0f0f;
    --focus: #8ab4f8;
    --warn: #ff9e80;
    --bw: 229px;                                 /* 플레이어 칸 (세로 9:16 — 스크립트가 화면에 맞춰) */
    --bh: 407px;
    --h: 100vh;                                  /* 장 높이 = 화면 높이 (스크립트가 px 로) */
    --band: calc((100vh - var(--bh)) / 2);       /* 칸 위·아래 남는 곳 */
    --sx: 16px;                                  /* 옆 자리(왼쪽 안내 · 오른쪽 채널): 가장자리에서 거리 · 너비 (스크립트가) */
    --sw: 102px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: var(--bg); overflow-anchor: none; overscroll-behavior-y: none; scrollbar-width: none; }
  html::-webkit-scrollbar, body::-webkit-scrollbar { display: none; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font-family: system-ui, -apple-system, "SamsungOne", "Noto Sans KR", sans-serif;
    overflow-x: hidden; word-break: keep-all; overflow-wrap: anywhere;
    -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
    -webkit-user-select: none; user-select: none;
  }
  p { margin: 0; }
  button { font: inherit; color: inherit; border: 0; background: none; padding: 0; margin: 0; cursor: pointer; touch-action: manipulation; }
  button:focus-visible, a:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }

  .slide { position: relative; height: var(--h); display: flex; flex-direction: column; align-items: center; overflow: hidden; }
  .band { flex: none; width: 100%; height: var(--band); }
  .box { flex: none; width: var(--bw); height: var(--bh); background: #000; }
  .box iframe { display: block; width: var(--bw); height: var(--bh); border: 0; }
  /* 다른 장: 미리보기 그림 = 칸 크기 (재생을 시작하는 그림은 120×70 이상 — 유튜브 규칙). 누르면 그 장으로 */
  .ph { display: grid; place-items: center; width: var(--bw); height: var(--bh); background: #000; }
  .ph img { display: block; width: var(--bw); height: var(--bh); object-fit: cover; background: #111; }

  /* 칸 옆 빈 곳 (칸과 겹치지 않음): 왼쪽 = 안내 글, 오른쪽 = 채널 단추. 위아래 가운데 */
  .side { position: absolute; top: 0; bottom: 0; width: var(--sw); overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; }
  .side.l { left: var(--sx); }
  .side.r { right: var(--sx); }
  .st, .sub { width: 100%; font-size: 20px; line-height: 1.25; }
  .st { color: var(--warn); }
  .st.info, .sub { color: #e8e8e8; }
  /* 채널 단추 — 누르면 워치 앱의 채널 화면 (동그란 그림 + 채널 이름, 누르는 자리는 단추 전체) */
  .ch { flex: none; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 6px 0; border-radius: 24px; }
  .ch .av { width: 76px; height: 76px; border-radius: 50%; background: var(--card); display: grid; place-items: center; }
  .ch .av svg { width: 44px; height: 44px; fill: currentColor; }
  .ch:active .av { background: var(--chip); }
  .ch .nm { max-width: 100%; font-size: 18px; font-weight: 700; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* 끝 장·안내 장: 가운데 */
  .msgc { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 17px; padding: 0 12%; text-align: center; }
  .big { width: fit-content; max-width: 100%; font-size: 27px; line-height: 1.35; font-weight: 700; }
  .sm { width: fit-content; max-width: 100%; font-size: 22px; line-height: 1.35; color: var(--dim); }
  .pill {
    display: inline-flex; align-items: center; justify-content: center; min-height: 74px;
    font-size: 25px; font-weight: 700; color: var(--fg); text-decoration: none;
    background: var(--card); border-radius: 37px; padding: 17px 30px;
  }
  .pill.accent { background: var(--primary); color: var(--on-primary); }

  /* 둥근 화면 밖으로 나가면 줄인다 (.fit) — 옆 자리는 칸 쪽을 기준으로 */
  .fit { transform-origin: 50% 50%; }
  .side.l .fit { transform-origin: 100% 50%; }
  .side.r .fit { transform-origin: 0 50%; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main id="feed" aria-label="Shorts"></main>

<script>
(function () {
  'use strict';
  var ID = /^[A-Za-z0-9_-]{11}$/;
  var MAX_IDS = 50;            // 앱이 넘기는 Shorts 는 50개까지
  var APP = 'com.mywatch.kakaomap';
  var BOX_MIN = 200;           // 유튜브 규칙: 플레이어 칸은 200×200 이상
  var TALL = 9 / 16;           // Shorts 칸 모양 (가로÷세로)
  var BOX_EDGE = 6;            // 칸 모서리를 둥근 화면 가장자리에서 띄우는 거리
  var SIDE_GAP = 8;            // 칸과 옆 자리 사이
  var SIDE_HALF = 70;          // 옆 자리 내용이 화면 가운데에서 위아래로 차지하는 만큼 (그 높이까지 둥근 화면 안에)
  var CH_MIN = 76;             // 채널 단추를 두려면 옆 자리가 이만큼 넓어야 (동그란 그림 — 누르는 자리는 단추 전체)
  var SIDE_MIN = 40;           // 안내 글을 두려면 옆 자리가 이만큼 넓어야
  var VISIBLE = 0.9;           // 플레이어 상자가 이만큼 보여야 재생 시작 (규칙은 절반 — 둥근 화면이라 넉넉히)
  var NUDGE = 14;              // 이만큼 이하로 움직이면 제자리 (장 높이의 3%)
  var SETTLE_MS = 120;         // 굴림이 이만큼 멈추면 장을 맞춘다
  var SKIP_MS = 2500;          // 못 트는 Shorts 를 알리고 다음 장으로 넘어가기까지
  var HINT_MS = 2500;          // 시작을 부탁하고 이만큼 안 나오면 '▶ 를 눌러'
  var HOLD_IDLE_MS = 6000;     // 멈춘 뒤 이만큼 조용하면 멈춤이 먹힌 것 (그 뒤 플레이어를 눌러 트는 건 막지 않음)
  var REQ_MS = 4000;           // 우리가 시작을 부탁한 뒤 이만큼 안에 나오면 우리 것 — 아니면 사용자가 플레이어 ▶ 를 누른 것
  var API_WAIT_MS = window.__kwApiWaitMs || 15000;   // 유튜브 플레이어 스크립트를 이만큼 기다린다 (화면이 켜진 시간만)
  // 앱에서 고른 지 이만큼 안 됐으면 첫 장을 바로 튼다 (뒤로 가기·되살아난 탭·새로 고침은 ▶ 를 기다림). 동영상 화면과 같은 규칙
  var FRESH_MS = window.__kwFreshMs || 5 * 60000;
  // 끝나면 처음부터 다시(Shorts 처럼) — 이 화면을 이만큼 안 만졌으면 반복을 멈춘다 (배터리). 시뮬레이터는 짧게
  var LOOP_IDLE_MS = window.__kwLoopIdleMs || 2 * 60000;
  var THUMB_AROUND = 2;        // 미리보기 그림은 지금 장 앞뒤 둘까지만 (2GB 워치 메모리)
  var INFO_AROUND = 1;         // 제목·채널은 앞뒤 하나까지 미리
  var EDGE = 5;                // 둥근 화면 가장자리에서 띄우는 거리
  var HINT = '가운데 ▶\u00a0를 눌러 시작하세요';
  var PAUSED = '멈췄어요 · ▶\u00a0로 이어서';
  var LOOP_STOP = '멈췄어요 · ▶\u00a0로 다시';
  var NEXT = '다음으로 넘어가요';
  var SWIPE = '넘기면 다음 Shorts';
  // 동영상 화면과 같은 말투, 칸 옆 좁은 자리에 들어가게 짧게
  var ERRORS = {
    2: '주소가 잘못됐어요',
    5: '이 워치에선 못 틀어요',
    100: '지워졌거나 비공개예요',
    101: '다른 곳 재생이 막혔어요',
    150: '다른 곳 재생이 막혔어요'
  };
  var S = { UNSTARTED: -1, ENDED: 0, PLAYING: 1, PAUSED: 2, BUFFERING: 3, CUED: 5 };

  var $ = function (id) { return document.getElementById(id); };
  var feed = $('feed');
  // 다른 앱(워치 앱)으로 보내는 링크 — 시뮬레이터는 window.__kwNavigate 로 가로챈다
  function navigate(url) {
    if (typeof window.__kwNavigate === 'function') { window.__kwNavigate(url); return; }
    location.href = url;
  }
  function report(e) { if (window.console && console.warn) console.warn('[워치 Shorts]', e); }

  // ---------- 상태 ----------
  var P = null;                // 지금 주소
  var slides = [];             // 장들 (마지막은 끝 장)
  var endK = 0;                // 끝 장 번호 (= Shorts 수)
  var active = -1;             // 지금 장 (플레이어가 있는 장)
  var cur = null;              // 지금 장의 플레이어
  var geo = null;              // 화면·둥근 화면 크기
  var titles = {}, pending = {};
  var seenSent = {};           // 앱에 이미 알린 '본 Shorts'
  var newest = readNewest();   // 이 탭이 받은 가장 최근 '고른 시각' (동영상 화면과 함께 씀)
  var wake = null, wakePending = false;
  var apiReady = false, apiDead = false, apiTimer = 0;
  var lastInteraction = Date.now();   // 이 화면을 마지막으로 만진 때 (반복 멈춤)
  var hostSeq = 0, resizeQueued = false;
  // 장 넘기기
  var seq = newSeq();          // 지난 맞춤 뒤의 굴림 (손가락 몸짓·사용자 굴림)
  var touching = false, touchAt = 0, gesture = null;
  var target = null, targetWhy = null, reissues = 0;
  var selfFrom = 0, selfTo = null;    // 우리가 굴리는 중인 곳 (그 사이 굴림은 우리 것)
  var settleTimer = 0, lastY = 0;

  function readNewest() { try { return Math.max(0, +(sessionStorage.getItem('kw.newest') || 0) || 0); } catch (e) { return 0; } }
  function saveNewest() { try { sessionStorage.setItem('kw.newest', String(newest)); } catch (e) {} }

  // 밖에서 온 글: 글자 방향을 뒤집거나 안 보이게 끼우는 글자는 빼고, 제어 문자는 띄어쓰기로, 띄어쓰기는 하나로, 글자 수로 자르기
  function clean(s, max) {
    s = String(s || '').replace(/[\u00ad\u061c\u180e\u200b\u200e\u200f\u202a-\u202e\u2060-\u2064\u2066-\u206f\ufeff]/g, '')
      .replace(/[\u0000-\u001f\u007f-\u009f]/g, ' ').replace(/\s+/g, ' ').trim();
    return Array.from(s).slice(0, max).join('');
  }
  function params() {
    var q;
    try { q = new URLSearchParams(location.hash.replace(/^#/, '')); } catch (e) { q = new URLSearchParams(''); }
    var ids = [];
    (q.get('ids') || '').split(',').forEach(function (x) {
      if (ID.test(x) && ids.indexOf(x) < 0 && ids.length < MAX_IDS) ids.push(x);
    });
    var i = parseInt(q.get('i') || '', 10);
    if (!(i > 0)) i = 0;
    if (i > ids.length - 1) i = Math.max(0, ids.length - 1);
    var n = parseInt(q.get('n') || '', 10);
    // 어린이용(또는 앱이 모름)인 Shorts — 유튜브 정책 III.E.4.j: 추적을 끈다 ('본 Shorts'로 알리지 않음)
    var kids = {};
    (q.get('k') || '').split(',').forEach(function (x) { if (ID.test(x)) kids[x] = true; });
    return { ids: ids, i: i, n: n > 0 ? n : 0, app: q.get('app') === '1', kids: kids };
  }
  // 워치 앱으로 가는 링크: 앱 안(GeckoView)에선 kakaowatch:// 를 앱이 받고, 인터넷 앱에선 intent:// 로 앱을 연다
  function appLink(path, app) {
    return app ? 'kakaowatch://' + path : 'intent://' + path + '#Intent;scheme=kakaowatch;package=' + APP + ';end';
  }
  // 방금 앱에서 고른 것인지: 고른 시각(n)이 최근이고 이 탭이 받은 것 중 가장 새로움 (뒤로 가기·되살아난 탭은 저절로 안 틂)
  function freshPick(p) {
    if (!p.n) return true;
    var fresh = p.n > newest && Math.abs(Date.now() - p.n) < FRESH_MS;
    if (p.n > newest) { newest = p.n; saveNewest(); }
    return fresh;
  }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  // ---------- 둥근 화면 (장마다 같은 자리: 장이 화면에 맞춰졌을 때 기준) ----------
  function measureGeo() {
    var W = window.innerWidth || 480;
    var vh = window.innerHeight || 480;
    // 칸: 둥근 화면(지름 = 짧은 쪽)에 모서리까지 들어가는 가장 큰 세로 칸 — 폭이 200 이 안 되면 200 으로 (유튜브 규칙이 먼저)
    var d = Math.min(W, vh) - 2 * BOX_EDGE;
    var hRaw = d / Math.sqrt(1 + TALL * TALL), bh = Math.floor(hRaw), bw = Math.floor(hRaw * TALL);
    if (bw < BOX_MIN) { bw = BOX_MIN; bh = Math.round(BOX_MIN / TALL); }
    var H = Math.max(bh, vh);
    var R = Math.min(W, H) / 2;
    // 옆 자리: 가운데 높이에서 위아래 SIDE_HALF 까지 둥근 화면 안 — 칸 옆에서 가장자리까지
    var half = Math.sqrt(Math.max(0, R * R - SIDE_HALF * SIDE_HALF));
    var sx = Math.ceil(W / 2 - half + EDGE);
    var sw = Math.max(0, Math.floor(W / 2 - bw / 2 - SIDE_GAP - sx));
    geo = { W: W, H: H, R: R, cx: W / 2, cy: H / 2, BW: bw, BH: bh, B: Math.max(0, (H - bh) / 2), sx: sx, sw: sw };
    var root = document.documentElement.style;
    root.setProperty('--h', H + 'px');
    root.setProperty('--band', geo.B + 'px');
    root.setProperty('--bw', bw + 'px');
    root.setProperty('--bh', bh + 'px');
    root.setProperty('--sx', sx + 'px');
    root.setProperty('--sw', sw + 'px');
  }
  // 안전망: 그래도 원 밖으로 나가는 것은 플레이어 쪽을 기준으로 줄인다 (장이 화면에 맞춰졌을 때 기준 — 장마다 같은 자리)
  function fitEl(e) {
    e.style.transform = '';
    if (!e.offsetParent || !geo) return;
    var sl = e.closest('.slide');
    if (!sl) return;
    var x = 0, y = 0;
    for (var p = e; p && p !== sl; p = p.offsetParent) { x += p.offsetLeft; y += p.offsetTop; }
    var w = e.offsetWidth, h = e.offsetHeight;
    if (!w || !h) return;
    var cs = getComputedStyle(e);
    var o = String(cs.transformOrigin || '').split(' ').map(parseFloat);
    var ox = isFinite(o[0]) ? o[0] : w / 2, oy = isFinite(o[1]) ? o[1] : h / 2;
    var rad = Math.min(parseFloat(cs.borderTopLeftRadius) || 0, w / 2, h / 2) * (1 - Math.SQRT1_2);
    var lim = (geo.R - 1) * (geo.R - 1);
    var fits = function (s) {
      var x0 = x + ox * (1 - s), y0 = y + oy * (1 - s), x1 = x0 + w * s, y1 = y0 + h * s, ins = rad * s;
      var pts = [[x0 + ins, y0 + ins], [x1 - ins, y0 + ins], [x0 + ins, y1 - ins], [x1 - ins, y1 - ins]];
      for (var j = 0; j < 4; j++) {
        var dx = pts[j][0] - geo.cx, dy = pts[j][1] - geo.cy;
        if (dx * dx + dy * dy > lim) return false;
      }
      return true;
    };
    if (fits(1)) return;
    var lo = 0.5, hi = 1;
    for (var it = 0; it < 8; it++) { var mid = (lo + hi) / 2; if (fits(mid)) lo = mid; else hi = mid; }
    e.style.transform = 'scale(' + lo.toFixed(3) + ')';
  }
  function fitIn(root) {
    var els = root.querySelectorAll('.fit');
    for (var i = 0; i < els.length; i++) fitEl(els[i]);
  }

  // ---------- 장 만들기 ----------
  function thumbUrl(id) { return 'https://i.ytimg.com/vi/' + id + '/hqdefault.jpg'; }
  function makeSlide(id, k) {
    var sec = el('section', 'slide');
    sec.setAttribute('data-k', String(k));
    var box = el('div', 'box');
    var ph = el('button', 'ph');
    ph.type = 'button';
    ph.setAttribute('aria-label', 'Shorts ' + (k + 1) + ' 재생');
    var img = document.createElement('img');
    img.alt = '';
    img.width = 229;
    img.height = 407;
    img.decoding = 'async';
    ph.appendChild(img);
    box.appendChild(ph);
    // 칸 왼쪽: 안내 글 (main = 굵은 안내, sub = 덧붙임)
    var left = el('div', 'side l');
    left.hidden = true;

    settleTimer = 0;
    if (!touching) {
      touching = true;
      touchAt = Date.now();
      seq.touched = true;
      gesture = { y0: window.scrollY, counted: false };
    }
    selfTo = null;
  }
  function onTouchEnd(e) {
    if (e && e.touches && e.touches.length) return;
    if (!touching) return;
    touching = false;
    if (gesture) {
      var dy = window.scrollY - gesture.y0;
      if (Math.abs(dy) > NUDGE) { seq.gestures += dy > 0 ? 1 : -1; gesture.counted = true; }
      seq.last = gesture;
      gesture = null;
    }
    armSettle();
  }
  function settle() {
    settleTimer = 0;
    if (!geo || !slides.length) return;
    if (touching) {
      if (Date.now() - touchAt < 8000) return;   // 손가락을 대고 있음 — 떼면 다시
      touching = false;   // 뗀 알림을 놓침 — 그만 기다린다
      gesture = null;
    }
    var y = window.scrollY, s = seq;
    seq = newSeq();
    var base = target != null ? target : Math.max(0, active);
    var k = base, why = target != null ? targetWhy : 'user';
    if (s.touched) {
      var g = s.gestures;
      if (s.last && !s.last.counted && Math.abs(y - s.last.y0) > NUDGE) g += y > s.last.y0 ? 1 : -1;   // 뗀 뒤 튕겨서 움직임
      if (g) { k = base + g; why = 'user'; }
    } else if (s.user) {
      var d = y - s.userFrom, ad = Math.abs(d), step = 0;
      if (ad > NUDGE) {
        // 한 번에 뛴 굴림만 있으면 그만큼 장 수 (딱 반이면 덜 가는 쪽), 조금씩 이어진 굴림(못 본 손가락·휠)은 한 장
        step = ad >= geo.H * 0.5 && !s.small ? Math.max(1, Math.ceil((ad - 2) / geo.H - 0.5)) : 1;
        k = base + (d < 0 ? -step : step);
        why = 'user';
      }
    }
    k = Math.max(0, Math.min(endK, k));
    if (Math.abs(y - k * geo.H) <= 1) {
      target = null;
      selfTo = null;
      reissues = 0;
      activate(k, why);
      return;
    }
    if (k === target && ++reissues > 8) {   // 끝내 못 감 (그럴 일은 없지만 갇히지 않게) — 가까운 장으로 바로
      reissues = 0;
      k = Math.max(0, Math.min(endK, Math.round(y / geo.H)));
      target = null;
      jump(k);
      activate(k, why);
      return;
    }
    if (k !== target) reissues = 0;
    scrollToSlide(k, why, true);
  }
  function scrollToSlide(k, why, smooth) {
    target = k;
    targetWhy = why;
    var top = k * geo.H;
    selfFrom = window.scrollY;
    selfTo = top;
    try { window.scrollTo({ top: top, behavior: smooth ? 'smooth' : 'auto' }); } catch (e) { window.scrollTo(0, top); }
    armSettle();   // 이미 거기면 굴림이 없다 — 그래도 맞춘다
  }
  // 바로 그 장 자리로 (처음 열 때·크기가 바뀔 때)
  function jump(k) {
    var top = k * geo.H;
    selfFrom = window.scrollY;
    selfTo = top;
    window.scrollTo(0, top);
    lastY = window.scrollY;
  }
  // 그 장으로 (키·미리보기·처음부터·못 트는 것 다음) — 앞서 굴린 것은 잊는다
  function goTo(k, why) {
    if (!geo || !slides.length) return;
    k = Math.max(0, Math.min(endK, k));
    seq = newSeq();
    reissues = 0;
    if (target == null && Math.abs(window.scrollY - k * geo.H) <= 1) { activate(k, why); return; }
    scrollToSlide(k, why, Math.abs(k - (target != null ? target : active)) <= 2);
  }

  // ---------- 열기 ----------
  function build(p) {
    leave();
    clearTimeout(settleTimer);
    settleTimer = 0;
    P = p;
    target = null;
    selfTo = null;
    seq = newSeq();
    touching = false;
    gesture = null;
    reissues = 0;
    active = -1;
    touched();
    var fresh = freshPick(p);
    feed.textContent = '';
    slides = [];
    if (!p.ids.length) { showMessage('볼 Shorts가 없어요', '워치 앱에서 Shorts 를 골라 주세요', 'find'); return; }
    if (apiDead) { showMessage('유튜브에 연결하지 못했어요', '인터넷 연결을 확인해 주세요', 'retry'); return; }
    p.ids.forEach(function (id, k) { slides.push(makeSlide(id, k)); });
    endK = p.ids.length;
    slides.push(makeEnd(endK));
    slides.forEach(function (sl) { feed.appendChild(sl.el); });
    measureGeo();
    jump(p.i);
    fitIn(slides[endK].el);
    activate(p.i, fresh ? 'pick' : 'stale');
  }
  // 크기가 바뀜(워치 인터넷 앱의 막대 등): 장·칸 크기와 옆 자리를 다시 맞추고 지금 장에 다시 맞춘다
  function relayout() {
    var old = geo;
    measureGeo();
    if (old && old.H === geo.H && old.W === geo.W) return;
    syncSize();
    slides.forEach(function (sl) {
      if (sl.end || sl.msg) { fitIn(sl.el); return; }
      if (titles[sl.id]) { renderTitle(sl); renderPill(sl); }
      renderStatus(sl);
      fitIn(sl.el);
    });
    if (slides.length) jump(target != null ? target : Math.max(0, active));
  }

  // 유튜브 플레이어 스크립트를 기다린다 — 화면이 켜져 있는 시간만 센다 (꺼지면 브라우저가 멈춰 시간이 한꺼번에 지남)
  function armApi() {
    clearTimeout(apiTimer);
    apiTimer = 0;
    if (apiReady || apiDead || document.visibilityState !== 'visible') return;
    apiTimer = setTimeout(function () {
      apiTimer = 0;
      if (apiReady || document.visibilityState !== 'visible') return;
      apiFailed();
    }, API_WAIT_MS);
  }
  function apiFailed() {
    if (cur && cur.player) return;
    apiDead = true;
    if (!P || !P.ids.length) return;   // '볼 Shorts가 없어요' 그대로
    showMessage('유튜브에 연결하지 못했어요', '인터넷 연결을 확인해 주세요', 'retry');
  }

  // ---------- 페이지 ----------
  window.addEventListener('scroll', onScroll, { passive: true });
  document.addEventListener('touchstart', onTouchStart, { passive: true, capture: true });
  document.addEventListener('touchend', onTouchEnd, { passive: true, capture: true });
  document.addEventListener('touchcancel', onTouchEnd, { passive: true, capture: true });
  ['pointerdown', 'click', 'wheel'].forEach(function (t) { document.addEventListener(t, touched, { passive: true, capture: true }); });
  document.addEventListener('keydown', function (e) {
    touched();
    if (e.altKey || e.ctrlKey || e.metaKey || !slides.length) return;
    var base = target != null ? target : Math.max(0, active), k = null;
    if (e.key === 'ArrowDown' || e.key === 'PageDown') k = base + 1;
    else if (e.key === 'ArrowUp' || e.key === 'PageUp') k = base - 1;
    else if (e.key === 'Home') k = 0;
    else if (e.key === 'End') k = endK;
    if (k == null) return;
    e.preventDefault();
    goTo(k, 'user');
  });
  // 사용자가 플레이어 안을 누름 (이 화면은 그 안을 못 보지만 초점이 플레이어로 간다) — 그 재생은 막지 않는다
  window.addEventListener('blur', function () {
    setTimeout(function () {
      var me = cur, a = document.activeElement;
      if (!me || !a || a.tagName !== 'IFRAME' || !me.sl.box.contains(a)) return;
      me.hold = false;
      touched();
    }, 0);
  });
  window.addEventListener('resize', function () {
    if (resizeQueued) return;
    resizeQueued = true;
    requestAnimationFrame(function () { resizeQueued = false; relayout(); });
  });
  // 유튜브 규칙: 보이지 않는 플레이어로 재생하지 않는다 → 화면이 꺼지거나 다른 앱으로 가면 멈춤, 돌아와도 저절로 안 틂 (▶)
  document.addEventListener('visibilitychange', function () {
    var me = cur;
    if (document.visibilityState === 'hidden') {
      clearTimeout(apiTimer);
      apiTimer = 0;
      touching = false;
      gesture = null;
      if (me) {
        if (me.t.skip) { clearTimeout(me.t.skip); me.t.skip = 0; status(me.msg, SWIPE); }   // 못 트는 것을 넘기려던 중 → 안 넘김
        var loading = me.player && me.ready && (me.state === S.PLAYING || me.state === S.BUFFERING || (me.req && !me.started));
        if (loading) { me.hold = true; safe(me, 'pauseVideo'); }
        if (loading || me.want) {
          // 방금 고른·넘긴 것이 아직 안 나왔으면 켜질 때 (얼마 안 됐으면), 보던 중이면 멈춤
          if (!me.started && intentFresh(me)) me.autoStart = true; else me.hiddenPause = true;
          me.want = false;
          me.req = 0;
        }
        me.playing = false;
      }
      keepAwake(false);
      return;
    }
    if (!apiReady && !apiDead) armApi();
    if (me) {
      // 시작하려던 것(꺼지기 전에 넘겼거나 꺼진 동안 넘어감)이 아직 안 나왔으면: 얼마 안 됐으면 지금 시작, 오래됐으면 ▶ 를 기다림
      var start = (me.autoStart || me.want) && !me.started;
      me.autoStart = false;
      if (start && intentFresh(me)) { me.want = true; tryStart(); }
      else if (start || me.hiddenPause) { me.want = false; me.hiddenPause = false; status(me.started ? PAUSED : '▶\u00a0를 눌러 재생해요', '', 'info'); }
      if (me.hold) holdIdle(me);   // 멈춤이 먹혔는지는 켜진 뒤부터 센다
    }
    syncAwake();
  });
  window.addEventListener('pageshow', function (e) {
    if (!e.persisted || !cur || !cur.player) return;
    try { if (cur.player.getPlayerState() !== S.PLAYING) { cur.playing = false; syncAwake(); } } catch (x) {}
  });
  window.addEventListener('offline', function () { if (cur) status('인터넷 연결이 끊겼어요', '', ''); });
  window.addEventListener('online', function () {
    if (apiDead) { location.reload(); return; }
    if (cur && cur.sl.stText === '인터넷 연결이 끊겼어요') status('');
  });
  // 워치 앱에서 다른 Shorts 를 고르면 같은 탭의 주소(#…)만 바뀐다 — 처음부터 다시 만든다
  window.addEventListener('hashchange', function () { build(params()); });

  window.onYouTubeIframeAPIReady = function () {
    apiReady = true;
    clearTimeout(apiTimer);
    apiTimer = 0;
    if (apiDead) {   // 늦게라도 왔다 — 안내를 거두고 다시 (고른 지 얼마 안 됐으면 바로 재생)
      apiDead = false;
      build(params());
      return;
    }
    ensurePlayer();
  };

  try { history.scrollRestoration = 'manual'; } catch (e) {}
  build(params());
  var s = document.createElement('script');
  s.src = 'https://www.youtube.com/iframe_api';
  s.onerror = function () { clearTimeout(apiTimer); apiTimer = 0; apiFailed(); };
  document.head.appendChild(s);
  armApi();
}());
</script>
</body>
</html>
