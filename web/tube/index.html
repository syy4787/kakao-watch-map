<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- 유튜브 임베드는 Referer 로 어디서 트는지 확인한다(없으면 153 오류) — 기본값을 그대로 쓴다고 못 박아 둔다 -->
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<!-- 워치 앱이 이 화면에 닿는지 확인할 때 찾는 표시 -->
<meta name="kakaowatch-player" content="1">
<title>워치 유튜브</title>
<style>
  /*
   * 갤럭시워치(둥근 화면, 폭 약 226px)용 유튜브 재생 화면.
   * 첫 화면 = 유튜브 공식 플레이어(최소 200×200)만 가운데, 아래로 돌리면 곡 이름·큰 조작 버튼·다음 곡.
   * 우리 것은 플레이어 위에 절대 겹치지 않는다 (유튜브 임베드 규칙).
   */
  :root {
    --bg: #000;
    --fg: #fff;
    --dim: #b0b3b8;
    --card: #1f2023;
    --chip: #2b2d31;
    --accent: #2f6fed;
    --accent-light: #7fb0ff;
    --warn: #ff8a3d;
    --player: 200px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: var(--bg); scroll-snap-type: y proximity; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font-family: system-ui, -apple-system, "SamsungOne", "Noto Sans KR", sans-serif;
    overflow-x: hidden; word-break: keep-all; overflow-wrap: anywhere;
    -webkit-text-size-adjust: 100%;
  }
  button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--accent-light); outline-offset: 2px; }

  /* 첫 화면: 플레이어만 둥근 화면 한가운데 */
  .stage {
    position: relative; height: 100vh; height: 100dvh; min-height: calc(var(--player) + 24px);
    display: flex; align-items: center; justify-content: center; scroll-snap-align: center;
  }
  #player, .stage iframe { width: var(--player); height: var(--player); display: block; border: 0; flex: none; background: #000; }
  /* 아래에 더 있다는 표시 — 플레이어 상자 바로 밑(겹치지 않음) */
  .down {
    position: absolute; left: 50%; top: calc(50% + var(--player) / 2 + 1px);
    width: 18px; height: 10px; margin-left: -9px; opacity: .55; pointer-events: none;
  }

  /* 둘째 화면: 지금 곡 + 조작 (둥근 화면 가운데에 오게 한 화면 높이) */
  .now {
    min-height: 100vh; min-height: 100dvh; padding: 22px 14%;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    text-align: center; scroll-snap-align: center;
  }
  #title {
    font-size: 15px; line-height: 1.3; font-weight: 700; margin: 0;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }
  #channel { font-size: 12px; color: var(--dim); margin: -4px 0 0; }
  #status { font-size: 12px; line-height: 1.35; color: var(--warn); margin: 0; min-height: 0; }
  #status:empty { display: none; }
  #status.info { color: var(--accent-light); }

  .ctl { display: flex; align-items: center; justify-content: center; gap: 12px; }
  .ctl button {
    width: 46px; height: 46px; border-radius: 50%; background: var(--chip);
    display: grid; place-items: center;
  }
  .ctl button svg { width: 24px; height: 24px; fill: currentColor; }
  .ctl #play { width: 58px; height: 58px; background: var(--accent); }
  .ctl #play svg { width: 30px; height: 30px; }
  .ctl button:disabled { opacity: .35; }

  /* 다음 곡 — 유튜브 규칙: 눌러서 재생을 시작하는 미리보기는 120×70 이상 → 124×70 세로 카드, 미리보기는 줄이지 않는다 */
  .next { padding: 4px 0 8px; }
  .next h2 { font-size: 12px; font-weight: 600; color: var(--dim); text-align: center; margin: 4px 0 8px; }
  .next ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; justify-items: center; }
  .next li { width: 100%; display: flex; justify-content: center; }
  .next li button {
    width: min(168px, 76vw); display: flex; flex-direction: column; align-items: center; gap: 4px;
    background: var(--card); border-radius: 16px; padding: 6px 6px 8px; text-align: center;
  }
  .next img { width: 124px; height: 70px; border-radius: 8px; object-fit: cover; flex: none; background: var(--chip); }
  .next .t {
    font-size: 12px; line-height: 1.3; max-width: 100%;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }

  .tail { padding: 6px 16% 40px; display: grid; gap: 8px; justify-items: center; text-align: center; }
  .tail a {
    display: inline-block; font-size: 13px; color: var(--fg); text-decoration: none;
    background: var(--chip); border-radius: 18px; padding: 9px 14px;
  }
  .tail p { font-size: 11px; line-height: 1.4; color: var(--dim); margin: 0; }
  /* 둥근 화면 위·아래 가장자리로 갈수록 작게(.fit) 또는 흐리게만(.fade) — 워치 목록처럼. 값은 스크립트가 넣는다 */
  .fit { transform-origin: 50% 50%; will-change: transform, opacity; }
  .fade { will-change: opacity; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <div class="stage" id="stage">
    <div id="player"></div>
    <svg class="down" viewBox="0 0 18 10" aria-hidden="true"><path d="M2 2l7 6 7-6" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
  </div>

  <section class="now" id="now" aria-live="polite">
    <p id="title" class="fit">불러오는 중…</p>
    <p id="channel" class="fit"></p>
    <p id="status" class="fit" role="status"></p>
    <div class="ctl fit">
      <button id="prev" type="button" aria-label="이전 곡"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
      <button id="play" type="button" aria-label="재생"><svg viewBox="0 0 24 24"><path id="playIcon" d="M8 5v14l11-7z"/></svg></button>
      <button id="next" type="button" aria-label="다음 곡"><svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
    </div>
  </section>

  <section class="next" id="upnext" hidden>
    <h2>다음 곡</h2>
    <ol id="list"></ol>
  </section>

  <div class="tail">
    <a id="back" class="fit" href="intent://tube#Intent;scheme=kakaowatch;package=com.mywatch.kakaomap;end">다른 곡 찾기</a>
    <p class="fit">유튜브 공식 플레이어로 재생해요.<br>화면이 켜져 있는 동안 계속 나와요.</p>
  </div>

<script>
(function () {
  'use strict';
  var ID = /^[A-Za-z0-9_-]{11}$/;
  var PLAY_PATH = 'M8 5v14l11-7z';
  var PAUSE_PATH = 'M6 5h4v14H6zm8 0h4v14h-4z';
  var UPNEXT = 5;
  // 플레이어 상자가 이만큼 화면 안에 있어야 '보인다' — 둥근 화면에서도 절반이 넘게 보이도록 넉넉히
  var VISIBLE = 0.9;
  var ERRORS = {
    2: '영상 주소가 잘못됐어요',
    5: '이 워치 브라우저에서 틀 수 없는 영상이에요',
    100: '지워졌거나 비공개인 영상이에요',
    101: '이 곡은 올린 사람이 다른 곳 재생을 막아 둬서 못 틀어요',
    150: '이 곡은 올린 사람이 다른 곳 재생을 막아 둬서 못 틀어요'
  };

  var $ = function (id) { return document.getElementById(id); };
  var player = null;
  var ready = false;          // onReady 전에는 플레이어 함수를 부르지 않는다
  var playing = false;
  var playingIndex = -1;
  var wake = null;
  var wakePending = false;
  var waiters = [];           // 플레이어가 보이면 할 일
  var waitTimer = 0;
  var titles = {};            // 영상 번호 → {title, author}
  var shownIndex = -1;
  var skipTimer = 0;
  var opened = null;          // 지금 연 곡 (주소의 #v=…)
  var triedSingle = false;    // 믹스를 못 불러와 이 곡만으로 다시 열어 봤음
  var hiddenPause = false;    // 화면이 꺼져서 멈췄음

  try { history.scrollRestoration = 'manual'; } catch (e) {}

  function params() {
    var q = new URLSearchParams(location.hash.replace(/^#/, ''));
    var v = q.get('v');
    if (!v || !ID.test(v)) return null;
    return { v: v, mix: q.get('mix') === '1', t: q.get('t') || '', c: q.get('c') || '' };
  }

  function status(text, info) {
    var s = $('status');
    s.textContent = text || '';
    s.className = info ? 'fit info' : 'fit';
    fitSoon();
  }

  function setNow(title, author) {
    if (title) { $('title').textContent = title; document.title = title; }
    $('channel').textContent = author || '';
    fitSoon();
  }

  function setPlaying(on) {
    playing = on;
    $('playIcon').setAttribute('d', on ? PAUSE_PATH : PLAY_PATH);
    $('play').setAttribute('aria-label', on ? '일시정지' : '재생');
    keepAwake(on);
  }

  function setButtons(enabled) {
    $('play').disabled = !enabled;
    $('prev').disabled = !enabled;
    if (!enabled) $('next').disabled = true;
  }

  // 재생하는 동안만 화면을 켜 둔다 (손목을 내려 화면이 꺼지면 브라우저가 멈추므로). 요청이 겹쳐 남는 일 없게
  function keepAwake(on) {
    try {
      if (on) {
        if (wake || wakePending || !navigator.wakeLock || document.visibilityState !== 'visible') return;
        wakePending = true;
        navigator.wakeLock.request('screen').then(function (w) {
          wakePending = false;
          if (!playing) { w.release().catch(function () {}); return; }
          wake = w;
          w.addEventListener('release', function () { if (wake === w) wake = null; });
        }).catch(function () { wakePending = false; });
      } else if (wake) {
        var w = wake;
        wake = null;
        w.release().catch(function () {});
      }
    } catch (e) { wakePending = false; }
  }

  // 유튜브 규칙: 보이지 않는 플레이어로 재생하지 않는다 → 화면이 꺼지거나 다른 앱으로 가면 멈춤, 돌아오면 ▶ 로 이어 듣기
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden') {
      clearWaiters();
      clearTimeout(skipTimer);
      if (ready && playing) {
        hiddenPause = true;
        try { player.pauseVideo(); } catch (e) {}
      }
    } else if (hiddenPause) {
      hiddenPause = false;
      status('화면이 꺼져서 멈췄어요 · ▶ 로 이어 들어요', true);
    }
  });

  function playerVisible() {
    if (document.visibilityState !== 'visible') return false;
    var el = $('player');
    if (!el) return false;
    var b = el.getBoundingClientRect();
    if (!b.width || !b.height) return false;
    var w = Math.max(0, Math.min(b.right, window.innerWidth) - Math.max(b.left, 0));
    var h = Math.max(0, Math.min(b.bottom, window.innerHeight) - Math.max(b.top, 0));
    return (w * h) / (b.width * b.height) >= VISIBLE;
  }

  function showPlayer(smooth) {
    $('stage').scrollIntoView({ behavior: smooth ? 'smooth' : 'auto', block: 'center' });
  }

  function clearWaiters() {
    waiters = [];
    if (waitTimer) { clearInterval(waitTimer); waitTimer = 0; }
  }

  // 유튜브 규칙: 재생은 플레이어가 보일 때만 시작 → 아래 화면에서 누르면 먼저 플레이어로 올라간 뒤.
  // 끝내 보이지 않으면(화면이 꺼짐 등) 하지 않는다
  function whenVisible(fn) {
    if (!ready) { status('불러오는 중이에요…', true); return; }
    if (playerVisible()) { fn(); return; }
    waiters.push(fn);
    showPlayer(true);
    if (waitTimer) return;
    var started = Date.now();
    waitTimer = setInterval(function () {
      if (playerVisible()) {
        var todo = waiters;
        clearWaiters();
        todo.forEach(function (f) { try { f(); } catch (e) {} });
      } else if (Date.now() - started > 1500) {
        clearWaiters();
      }
    }, 80);
  }

  // 곡 이름: 유튜브 oEmbed (공개 주소, 이 화면 주소에서 읽기 허용됨)
  function info(id) {
    if (titles[id]) return Promise.resolve(titles[id]);
    var url = 'https://www.youtube.com/oembed?format=json&url=' +
      encodeURIComponent('https://www.youtube.com/watch?v=' + id);
    return fetch(url).then(function (r) { return r.ok ? r.json() : null; }).then(function (j) {
      if (j && j.title) titles[id] = { title: j.title, author: j.author_name || '' };
      return titles[id] || null;
    }).catch(function () { return null; });
  }

  function currentId() {
    if (ready) {
      try {
        var m = /[?&]v=([A-Za-z0-9_-]{11})/.exec(player.getVideoUrl() || '');
        if (m) return m[1];
      } catch (e) {}
    }
    return opened ? opened.v : null;
  }

  function playlist() {
    if (!ready) return [];
    try { return player.getPlaylist() || []; } catch (e) { return []; }
  }

  function index() {
    if (!ready) return -1;
    try { return player.getPlaylistIndex(); } catch (e) { return -1; }
  }

  function refreshNow() {
    if (!ready) return;
    var id = currentId();
    if (id && titles[id]) {
      setNow(titles[id].title, titles[id].author);
    } else if (id) {
      info(id).then(function (t) { if (t && id === currentId()) setNow(t.title, t.author); });
    }
    refreshList();
  }

  function refreshList() {
    var ids = playlist();
    var at = index();
    var hasList = ids.length > 1;
    $('next').disabled = !ready || !hasList || at >= ids.length - 1;
    if (!hasList) { $('upnext').hidden = true; return; }
    if (at === shownIndex && $('list').children.length) return;
    shownIndex = at;
    var list = $('list');
    list.textContent = '';
    ids.slice(at + 1, at + 1 + UPNEXT).forEach(function (id, k) {
      var i = at + 1 + k;
      var li = document.createElement('li');
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'fade';
      var img = document.createElement('img');
      img.alt = '';
      img.loading = 'lazy';
      img.width = 124;
      img.height = 70;
      img.src = 'https://i.ytimg.com/vi/' + id + '/mqdefault.jpg';
      var t = document.createElement('span');
      t.className = 't fit';
      t.textContent = titles[id] ? titles[id].title : '…';
      b.appendChild(img);
      b.appendChild(t);
      b.setAttribute('aria-label', (titles[id] ? titles[id].title : '다음 곡') + ' 재생');
      b.addEventListener('click', function () {
        status('');
        whenVisible(function () { player.playVideoAt(i); });
      });
      li.appendChild(b);
      list.appendChild(li);
      info(id).then(function (x) {
        if (x) { t.textContent = x.title; b.setAttribute('aria-label', x.title + ' 재생'); fitSoon(); }
      });
    });
    $('upnext').hidden = false;
    fitSoon();
  }

  // 둥근 화면: 위·아래 끝이 원 밖으로 나가는 줄은 그 높이의 원 폭에 맞게 줄이고(.fit), 미리보기 카드는 흐리게만(.fade).
  // 크기는 변형의 영향을 안 받는 offset 값으로 잰다
  var fitQueued = false;
  function docTop(el) {
    var t = 0;
    while (el) { t += el.offsetTop; el = el.offsetParent; }
    return t;
  }
  function fitAll() {
    fitQueued = false;
    var h = window.innerHeight;
    var r = Math.min(window.innerWidth, h) / 2;
    var cy = h / 2;
    var sy = window.scrollY;
    var els = document.querySelectorAll('.fit, .fade');
    for (var i = 0; i < els.length; i++) {
      var el = els[i];
      if (!el.offsetParent) continue;
      var top = docTop(el) - sy;
      var bottom = top + el.offsetHeight;
      if (bottom < -40 || top > h + 40) continue;
      var dy = Math.max(Math.abs(top - cy), Math.abs(bottom - cy));
      var chord = dy >= r ? 0 : 2 * Math.sqrt(r * r - dy * dy);
      if (el.classList.contains('fade')) {
        var over = el.offsetWidth - chord;
        el.style.opacity = over > 30 ? '0.35' : (over > 6 ? '0.7' : '');
        continue;
      }
      var s = Math.max(0.6, Math.min(1, (chord - 6) / el.offsetWidth));
      el.style.transform = s < 0.995 ? 'scale(' + s.toFixed(3) + ')' : '';
      el.style.opacity = s <= 0.6 ? '0.35' : (s < 0.8 ? '0.7' : '');
    }
  }
  function fitSoon() {
    if (!fitQueued) { fitQueued = true; requestAnimationFrame(fitAll); }
  }
  window.addEventListener('scroll', fitSoon, { passive: true });
  window.addEventListener('resize', fitSoon);

  function onReady() {
    ready = true;
    setButtons(true);
    refreshNow();
    // 브라우저가 소리 자동 재생을 막으면 플레이어 가운데 ▶ 로 시작
    setTimeout(function () {
      if (ready && !playing) status('플레이어 가운데 ▶ 를 눌러 시작하세요', true);
    }, 2500);
  }

  function onStateChange(e) {
    var S = YT.PlayerState;
    if (e.data === S.PLAYING) {
      clearTimeout(skipTimer);
      hiddenPause = false;
      if (document.visibilityState !== 'visible') { player.pauseVideo(); return; }
      playingIndex = index();
      status('');
      setPlaying(true);
      refreshNow();
    } else if (e.data === S.PAUSED) {
      setPlaying(false);
    } else if (e.data === S.ENDED) {
      setPlaying(false);
      var ids = playlist();
      if (ids.length > 1 && index() < ids.length - 1) {
        // 다음 곡이 곧 시작 → 그 전에 플레이어가 보이게 (재생은 보일 때만)
        if (!playerVisible()) showPlayer(false);
      } else {
        status('끝났어요 · ▶ 를 누르면 다시 들어요', true);
      }
    } else if (e.data === S.BUFFERING || e.data === -1) {
      // 새 곡을 불러오는 중 — 아래 화면을 보고 있으면 플레이어로 (같은 곡이 잠깐 끊긴 건 그대로)
      if (index() !== playingIndex && !playerVisible()) showPlayer(false);
      if (e.data === -1) refreshNow();
    } else if (e.data === S.CUED) {
      refreshNow();
    }
  }

  function onError(e) {
    setPlaying(false);
    var ids = playlist();
    var at = index();
    // 믹스 목록 때문에 열리지 않은 듯하면(설정값 오류) 이 곡만으로 한 번 더. 곡 자체가 막힌 경우(100·101·150)는 그대로 알린다
    if (opened && opened.mix && !triedSingle && ids.length === 0 && (e.data === 2 || e.data === 5)) {
      triedSingle = true;
      load({ v: opened.v, mix: false, t: opened.t, c: opened.c }, true);
      status('믹스를 못 불러와서 이 곡만 틀어요', true);
      return;
    }
    var msg = ERRORS[e.data] || ('재생하지 못했어요 (' + e.data + ')');
    if (ids.length > 1 && at >= 0 && at < ids.length - 1) {
      status(msg + ' · 다음 곡으로 넘어가요');
      clearTimeout(skipTimer);
      skipTimer = setTimeout(function () { whenVisible(function () { player.nextVideo(); }); }, 2500);
    } else {
      status(msg);
    }
  }

  function load(p, keepTried) {
    clearWaiters();
    clearTimeout(skipTimer);
    if (!keepTried) triedSingle = false;
    opened = p;
    ready = false;
    shownIndex = -1;
    playingIndex = -1;
    hiddenPause = false;
    setPlaying(false);
    setButtons(false);
    $('upnext').hidden = true;
    if (player) { try { player.destroy(); } catch (e) {} player = null; }
    if (!$('player')) {   // destroy 가 자리를 못 돌려놓았으면 다시 만든다
      var host = document.createElement('div');
      host.id = 'player';
      $('stage').insertBefore(host, $('stage').firstChild);
    }
    // 아래를 보고 있었어도 플레이어가 보이는 맨 위에서 시작 (자동 재생은 보일 때만)
    window.scrollTo(0, 0);
    if (!p) {
      setNow('들을 곡이 없어요', '');
      status('워치 앱 ‘유튜브 음악’에서 곡을 고르면 여기서 재생돼요', true);
      return;
    }
    status('');
    if (p.t) titles[p.v] = { title: p.t, author: p.c };
    setNow(p.t || '불러오는 중…', p.c);
    var vars = {
      playsinline: 1,
      autoplay: 1,
      // 플레이어 아래쪽 조작 막대는 둥근 화면 가장자리에 잘린다 → 숨기고(문서에 있는 설정) 아래에 큰 버튼을 둔다
      controls: 0,
      rel: 0,
      iv_load_policy: 3,
      origin: location.origin
    };
    // 믹스: 이 곡으로 시작해 유튜브가 비슷한 곡을 이어 주는 재생목록
    if (p.mix) vars.list = 'RD' + p.v;
    player = new YT.Player('player', {
      width: 200,
      height: 200,
      videoId: p.v,
      playerVars: vars,
      events: { onReady: onReady, onStateChange: onStateChange, onError: onError }
    });
  }

  $('play').addEventListener('click', function () {
    if (!ready) { status('불러오는 중이에요…', true); return; }
    hiddenPause = false;
    status('');
    if (playing) { player.pauseVideo(); return; }
    whenVisible(function () { player.playVideo(); });
  });
  $('prev').addEventListener('click', function () {
    status('');
    whenVisible(function () {
      if (playlist().length > 1 && index() > 0) player.previousVideo(); else player.seekTo(0, true);
    });
  });
  $('next').addEventListener('click', function () {
    status('');
    whenVisible(function () { player.nextVideo(); });
  });

  // 워치 앱에서 다른 곡을 고르면 같은 탭의 주소(#…)만 바뀐다 (같은 곡이어도 n= 이 달라 바뀜)
  window.addEventListener('hashchange', function () {
    if (window.YT && window.YT.Player) load(params());
  });

  window.onYouTubeIframeAPIReady = function () { load(params()); };

  setButtons(false);
  fitSoon();
  var s = document.createElement('script');
  s.src = 'https://www.youtube.com/iframe_api';
  s.onerror = function () {
    setNow('유튜브에 연결하지 못했어요', '');
    status('인터넷 연결을 확인하고 다시 열어 주세요');
  };
  document.head.appendChild(s);
}());
</script>
</body>
</html>
